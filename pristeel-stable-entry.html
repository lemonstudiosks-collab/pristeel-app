<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>PRISTEEL — Duke u hapur</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f9fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20272b;padding:24px}.card{width:min(410px,100%);background:#fff;border:1px solid #dce7eb;border-radius:20px;padding:32px;box-shadow:0 18px 50px rgba(42,72,84,.11);text-align:center}.mark{width:48px;height:48px;margin:0 auto 15px;border-radius:15px 15px 15px 6px;background:linear-gradient(145deg,#72aec4,#3e7e96);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:760}.title{font-size:19px;font-weight:760}.sub{font-size:12px;color:#7f898e;margin-top:5px}.bar{height:8px;background:#eaf2f5;border-radius:99px;overflow:hidden;margin:24px 0 12px}.fill{height:100%;width:8%;background:linear-gradient(90deg,#67a8c0,#3f7f98);border-radius:99px;transition:width .2s}.status{font-size:11.5px;color:#657177;min-height:18px}.error{color:#a33a2e}.retry{display:none;width:100%;height:42px;margin-top:15px;border:0;border-radius:10px;background:linear-gradient(135deg,#67a8c0,#3f7f98);color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body><main class="card"><div class="mark">P</div><div class="title">PRISTEEL</div><div class="sub">Po ngarkohet versioni stabil i platformës.</div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Duke pastruar cache-in…</div><button class="retry" id="retry">Provo përsëri</button></main>
<script>
(function(){
'use strict';
var FILES=[
 'pristeel-roles.js',
 /* Exact URL loaded by pristeel-roles.js. This must be refreshed, not an alias URL. */
 'pristeel-project-emails.js?v=20260804-2',
 'pristeel-login-theme-v2.js?v=20260804-production5',
 'pristeel-workspace-architecture-v1.js?v=20260804-production3',
 'pristeel-workspace-release-fix-v2.js?v=20260804-production13',
 'pristeel-workspace-runtime-guard.js?v=20260804-production13',
 'pristeel-project-document-reconciliation-lite.js?v=20260804-production8',
 'pristeel-project-status-actions.js?v=20260804-production13',
 'pristeel-projects-modern-list.js?v=20260804-production13',
 'pristeel-project-family-workspace.js?v=20260804-production15',
 'pristeel-document-center-core.js?v=20260804-2',
 'pristeel-document-delete-actions.js?v=20260804-production9',
 'pristeel-document-adjustments-v3.js?v=20260804-2',
 'pristeel-document-adjustments-v4.js?v=20260804-production4',
 'pristeel-document-adjustments-v4-ui-fix.js?v=20260804-production4',
 'pristeel-document-adjustments-v5-language-v2.js?v=20260804-production5',
 'pristeel-dashboard-action-controls-v2.js?v=20260804-2',
 'pristeel-project-loss.js?v=20260804-2',
 'pristeel-document-shortcuts.js?v=20260804-2',
 'pristeel-invoice-copy-fix.js?v=20260804-2'
];
var fill=document.getElementById('fill'),status=document.getElementById('status'),retry=document.getElementById('retry');
function p(n,t){fill.style.width=Math.max(8,Math.round(n/t*100))+'%';}
async function clearOld(){try{localStorage.removeItem('pst_single_instance_owner_v1');localStorage.removeItem('pst_single_instance_message_v1');}catch(e){}try{sessionStorage.removeItem('pst_single_instance_tab_id_v1');}catch(e){}if('serviceWorker' in navigator){try{var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister();}));}catch(e){}}if(window.caches){try{var keys=await caches.keys();await Promise.all(keys.map(function(k){return caches.delete(k);}));}catch(e){}}}
async function loadFile(path){var r=await fetch(path,{cache:'reload',credentials:'same-origin'});if(!r.ok)throw new Error(path+' ('+r.status+')');await r.arrayBuffer();}
async function run(){retry.style.display='none';status.className='status';status.textContent='Duke pastruar cache-in…';p(0,FILES.length+1);await clearOld();for(var i=0;i<FILES.length;i++){status.textContent='Duke ngarkuar modulet… '+(i+1)+'/'+FILES.length;p(i+1,FILES.length+1);await loadFile(FILES[i]);}status.textContent='Platforma është gati.';p(FILES.length+1,FILES.length+1);setTimeout(function(){location.replace('pristeel-procurement.html?workspace=20260804-production16');},300);}
retry.onclick=run;run().catch(function(e){console.error(e);status.className='status error';status.textContent='Ngarkimi nuk përfundoi. Provo përsëri.';retry.style.display='block';});
})();
</script></body></html>
