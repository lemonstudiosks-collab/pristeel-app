<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PRISTEEL — Hyrje</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f9fa;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20272b;padding:24px}
    .card{width:min(390px,100%);background:#fff;border:1px solid #dce7eb;border-radius:19px;padding:31px;box-shadow:0 20px 55px rgba(42,72,84,.11)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .mark{width:44px;height:44px;border-radius:14px 14px 14px 5px;background:linear-gradient(145deg,#72aec4,#3e7e96);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:760;box-shadow:0 10px 22px rgba(62,126,150,.22)}
    .name{font-size:18px;font-weight:770;letter-spacing:.2px}.sub{font-size:11px;color:#858e93;margin-top:2px}
    label{display:block;font-size:10px;font-weight:750;letter-spacing:.7px;text-transform:uppercase;color:#7b858b;margin:13px 0 6px}
    input{width:100%;height:45px;border:1px solid #d8e2e6;border-radius:11px;padding:0 12px;font:inherit;font-size:13px;outline:none;background:#fff}
    input:focus{border-color:#5b9bb3;box-shadow:0 0 0 4px rgba(91,155,179,.12)}
    button{width:100%;height:45px;border:0;border-radius:11px;margin-top:18px;background:linear-gradient(135deg,#67a8c0,#3f7f98);color:#fff;font-size:13px;font-weight:730;cursor:pointer;box-shadow:0 9px 22px rgba(62,126,150,.20)}
    button:disabled{opacity:.65;cursor:wait}
    .msg{min-height:20px;margin-top:12px;font-size:11.5px;line-height:1.45;color:#a33a2e;text-align:center}
    .note{font-size:10.5px;color:#8c959a;line-height:1.55;margin-top:17px;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="mark">P</div>
      <div><div class="name">PRISTEEL</div><div class="sub">Procurement Platform</div></div>
    </div>
    <form id="login-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" type="email" name="username" autocomplete="username" placeholder="email@prissteel.com" required>
      <label for="password">Fjalëkalimi</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Hyr në platformë</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="note">Platforma hapet vetëm pasi hyrja dhe ruajtja e sesionit të verifikohen.</div>
  </main>
<script>
(function(){
'use strict';
var SB_URL='https://isymxqfqzkchbsrbhucf.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzeW14cWZxemtjaGJzcmJodWNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDU1NzYsImV4cCI6MjA5ODIyMTU3Nn0.H25Z7TSVv0OD0X1QPqlowAr0uLSo88_Bu7R_cW6KAIM';
var BRIDGE='pristeel-session-bridge.html?v=20260804-1';

function clearStaleState(){
  var keys=[
    'pristeel_session','pst_pristeel_session_backup_v1',
    'pst_auth_session_snapshot_v2','pst_auth_session_snapshot_v3',
    'pst_auth_restore_marker_v2','pst_auth_restore_marker_v3',
    'pst_single_instance_owner_v1','pst_single_instance_message_v1'
  ];
  keys.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
  try{
    sessionStorage.removeItem('pst_single_instance_tab_id_v1');
    sessionStorage.removeItem('pst_login_session_handoff_v1');
  }catch(e){}
}
function saveSession(s){
  var payload={
    access_token:s.access_token,
    refresh_token:s.refresh_token,
    expires_at:Date.now()+((s.expires_in||3600)*1000)-30000,
    email:s.user&&s.user.email
  };
  var text=JSON.stringify(payload);
  localStorage.setItem('pristeel_session',text);
  sessionStorage.setItem('pst_login_session_handoff_v1',text);
  var verifyLocal=localStorage.getItem('pristeel_session');
  var verifySession=sessionStorage.getItem('pst_login_session_handoff_v1');
  if(verifyLocal!==text||verifySession!==text){throw new Error('Sesioni nuk u ruajt në browser.');}
}

clearStaleState();

var form=document.getElementById('login-form');
var btn=document.getElementById('submit');
var msg=document.getElementById('msg');

form.addEventListener('submit',async function(ev){
  ev.preventDefault();
  msg.textContent='';
  btn.disabled=true;
  btn.textContent='Duke hyrë…';
  var email=document.getElementById('email').value.trim();
  var password=document.getElementById('password').value;
  try{
    var res=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:password})
    });
    var data=await res.json().catch(function(){return{};});
    if(!res.ok||!data.access_token){
      throw new Error(data.error_description||data.msg||data.message||'Email ose fjalëkalim i gabuar.');
    }
    saveSession(data);
    msg.style.color='#2f7657';
    msg.textContent='Hyrja u pranua. Sesioni u ruajt. Duke hapur platformën…';
    setTimeout(function(){window.location.replace(BRIDGE);},350);
  }catch(err){
    msg.style.color='#a33a2e';
    msg.textContent=err&&err.message?err.message:'Gabim lidhjeje. Provo përsëri.';
    btn.disabled=false;
    btn.textContent='Hyr në platformë';
  }
});
})();
</script>
</body>
</html>
