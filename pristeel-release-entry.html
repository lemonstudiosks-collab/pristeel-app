<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>PRISTEEL</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f9fa;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20272b;padding:24px}.card{width:min(410px,100%);background:#fff;border:1px solid #dce7eb;border-radius:19px;padding:32px;box-shadow:0 20px 55px rgba(42,72,84,.11);text-align:center}.mark{width:48px;height:48px;border-radius:15px 15px 15px 6px;background:linear-gradient(145deg,#72aec4,#3e7e96);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:760;margin:0 auto 15px;box-shadow:0 10px 22px rgba(62,126,150,.22)}h1{font-size:19px;margin:0;font-weight:760}.sub{font-size:12px;color:#7f898e;margin-top:5px;line-height:1.55}.bar{height:8px;background:#eaf2f5;border-radius:999px;overflow:hidden;margin:24px 0 12px}.fill{height:100%;width:8%;background:linear-gradient(90deg,#67a8c0,#3f7f98);border-radius:999px;transition:width .22s ease}.status{min-height:19px;font-size:11.5px;color:#657177}.error{color:#a33a2e}.btn{display:none;width:100%;height:43px;border:0;border-radius:10px;margin-top:16px;background:linear-gradient(135deg,#67a8c0,#3f7f98);color:#fff;font-size:13px;font-weight:720;cursor:pointer}
</style>
</head>
<body>
<main class="card"><div class="mark">P</div><h1>PRISTEEL</h1><div class="sub">Po ngarkohet workspace-i i prodhimit.</div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Duke kontrolluar skedarët…</div><button class="btn" id="retry" type="button">Provo përsëri</button></main>
<script>
(function(){
'use strict';
var TARGET='pristeel-procurement.html?release=workspace-20260804-2';
var FILES=[
 'pristeel-procurement.html',
 'pristeel-roles.js',
 'pristeel-project-emails.js?v=20260804-2',
 'pristeel-single-instance.js?v=20260804-release1',
 'pristeel-document-center-core.js?v=20260804-release1',
 'pristeel-document-adjustments-v3.js?v=20260804-release1',
 'pristeel-workspace-architecture-v1.js?v=20260804-release1',
 'pristeel-workspace-release-fix-v2.js?v=20260804-release2'
];
var fill=document.getElementById('fill'),status=document.getElementById('status'),retry=document.getElementById('retry');
function progress(n,t,text){fill.style.width=Math.max(8,Math.round(n/t*100))+'%';status.textContent=text;}
async function clean(){
 try{localStorage.removeItem('pst_single_instance_owner_v1');localStorage.removeItem('pst_single_instance_message_v1');}catch(e){}
 if('serviceWorker' in navigator){try{var r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(function(x){return x.unregister();}));}catch(e){}}
 if(window.caches){try{var k=await caches.keys();await Promise.all(k.map(function(x){return caches.delete(x);}));}catch(e){}}
}
async function prime(url){var r=await fetch(url,{cache:'reload',credentials:'same-origin'});if(!r.ok)throw new Error(url+' ('+r.status+')');await r.arrayBuffer();}
async function run(){
 retry.style.display='none';status.className='status';progress(0,FILES.length+1,'Duke pastruar cache-in e vjetër…');await clean();
 for(var i=0;i<FILES.length;i++){progress(i+1,FILES.length+1,'Duke ngarkuar workspace-in… '+(i+1)+'/'+FILES.length);await prime(FILES[i]);}
 progress(FILES.length+1,FILES.length+1,'Platforma është gati.');setTimeout(function(){location.replace(TARGET);},300);
}
retry.onclick=run;
run().catch(function(e){console.error(e);status.className='status error';status.textContent='Ngarkimi nuk përfundoi. Provo përsëri.';retry.style.display='block';});
})();
</script>
</body>
</html>
