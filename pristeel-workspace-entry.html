<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>PRISTEEL</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f9fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20282c}.box{width:min(390px,calc(100% - 36px));background:#fff;border:1px solid #dce8ec;border-radius:18px;padding:30px;text-align:center;box-shadow:0 20px 52px rgba(46,89,105,.12)}.logo{width:48px;height:48px;border-radius:15px 15px 15px 6px;margin:0 auto 14px;background:linear-gradient(145deg,#72aec4,#3e7e96);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}.title{font-weight:800;font-size:18px}.sub{color:#7b878c;font-size:12px;margin-top:5px}.bar{height:7px;border-radius:99px;background:#e9f2f5;margin-top:22px;overflow:hidden}.fill{height:100%;width:10%;border-radius:99px;background:linear-gradient(90deg,#67a8c0,#3f7f98);transition:width .2s}.status{font-size:11px;color:#718086;margin-top:10px}
</style>
</head>
<body>
<div class="box"><div class="logo">P</div><div class="title">PRISTEEL</div><div class="sub">Duke hapur workspace-in e riparuar</div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Duke pastruar versionin e vjetër…</div></div>
<script>
(async function(){
'use strict';
var files=['pristeel-procurement.html','pristeel-roles.js','pristeel-project-emails.js','pristeel-workspace-architecture-v1.js?v=20260804-2','pristeel-workspace-hotfix-v1.js?v=20260804-2','pristeel-document-center-core.js?v=20260804-2','pristeel-document-adjustments-v3.js?v=20260804-2'];
var fill=document.getElementById('fill'),status=document.getElementById('status');
try{
 if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister();}));}
 if(window.caches){var keys=await caches.keys();await Promise.all(keys.map(function(k){return caches.delete(k);}));}
 try{localStorage.removeItem('pst_single_instance_owner_v1');localStorage.removeItem('pst_single_instance_message_v1');}catch(e){}
 for(var i=0;i<files.length;i++){
  status.textContent='Duke ngarkuar komponentët… '+(i+1)+'/'+files.length;
  fill.style.width=Math.round(((i+1)/files.length)*100)+'%';
  var r=await fetch(files[i],{cache:'reload',credentials:'same-origin'});
  if(!r.ok)throw new Error(files[i]);
  await r.arrayBuffer();
 }
 status.textContent='Gati. Duke hapur platformën…';
 setTimeout(function(){location.replace('pristeel-procurement.html?workspace=20260804-3');},300);
}catch(e){status.textContent='Ngarkimi dështoi. Rihape këtë faqe.';status.style.color='#a64b42';}
})();
</script>
</body>
</html>
