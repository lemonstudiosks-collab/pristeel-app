<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRISTEEL · Gmail</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#fff;color:#5c5a57;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .box{text-align:center;padding:28px}
    .mark{font-size:22px;font-weight:750;letter-spacing:.08em;color:#a65f2e;margin-bottom:8px}
    .msg{line-height:1.5}
    button{margin-top:16px;border:0;border-radius:8px;background:#a65f2e;color:#fff;padding:9px 14px;font-weight:650;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">PRISTEEL</div>
    <div class="msg" id="msg">Po dërgohet kërkesa te platforma…</div>
    <button id="manual" style="display:none">Hap platformën</button>
  </div>
  <script>
  (function(){
    var target=new URL('pristeel-procurement.html',window.location.href);
    target.search=window.location.search;
    target.hash=window.location.hash;

    var opened=null;
    try{opened=window.open(target.href,'PRISTEEL_MAIN');}catch(e){}

    if(!opened){
      window.location.replace(target.href);
      return;
    }

    try{opened.focus();}catch(e){}

    var attempts=0;
    function closeLauncher(){
      attempts++;
      try{window.close();}catch(e){}
      if(window.closed)return;
      if(attempts<4){setTimeout(closeLauncher,250);return;}

      var msg=document.getElementById('msg');
      var button=document.getElementById('manual');
      msg.textContent='Kërkesa u dërgua te PRISTEEL. Këtë tab mund ta mbyllësh.';
      button.style.display='inline-block';
      button.onclick=function(){
        try{opened.focus();}catch(e){}
      };
    }
    setTimeout(closeLauncher,350);
  })();
  </script>
</body>
</html>
