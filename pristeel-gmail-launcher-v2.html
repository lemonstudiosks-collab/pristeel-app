<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRISTEEL · Gmail</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#fff;color:#5c5a57;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .box{text-align:center;padding:28px;max-width:460px}.mark{font-size:22px;font-weight:750;letter-spacing:.08em;color:#a65f2e;margin-bottom:8px}.msg{line-height:1.5}
    button{margin-top:16px;border:0;border-radius:8px;background:#a65f2e;color:#fff;padding:9px 14px;font-weight:650;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">PRISTEEL</div>
    <div class="msg" id="msg">Po dërgohet kërkesa te platforma…</div>
    <button id="manual" style="display:none">Hap kërkesën këtu</button>
  </div>
  <script>
  (function(){
    'use strict';
    var OWNER_KEY='pst_single_instance_owner_v1';
    var MESSAGE_KEY='pst_single_instance_message_v1';
    var target=new URL('pristeel-procurement.html',window.location.href);
    target.search=window.location.search;
    target.hash=window.location.hash;

    function parse(value){try{return JSON.parse(value||'null');}catch(e){return null;}}
    function openHere(){window.location.replace(target.href);}
    function showManual(text){
      document.getElementById('msg').textContent=text;
      var button=document.getElementById('manual');
      button.style.display='inline-block';
      button.onclick=openHere;
    }
    function send(owner){
      var message={
        type:'handoff',
        mid:'gmail-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),
        from:'gmail-launcher',
        to:owner.id,
        target:target.href,
        at:Date.now()
      };
      try{
        localStorage.setItem(MESSAGE_KEY,JSON.stringify(message));
        localStorage.removeItem(MESSAGE_KEY);
        return true;
      }catch(e){return false;}
    }

    var owner=null;
    try{owner=parse(localStorage.getItem(OWNER_KEY));}catch(e){}
    var ownerFresh=!!(owner&&owner.id&&owner.ts&&(Date.now()-Number(owner.ts)<10000));

    if(!ownerFresh){
      openHere();
      return;
    }

    send(owner);
    setTimeout(function(){send(owner);},180);
    setTimeout(function(){send(owner);},520);
    setTimeout(function(){
      try{window.close();}catch(e){}
      if(!window.closed){
        showManual('Kërkesa iu dërgua tab-it ekzistues të PRISTEEL-it. Këtë tab mund ta mbyllësh.');
      }
    },850);
  })();
  </script>
</body>
</html>
