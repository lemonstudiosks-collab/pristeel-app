name: TEMP Cleanup 15J marker smoke updates

on:
  push:
    branches:
      - cleanup/ai-compat-marker-retirement-20260814
    paths:
      - scripts/update-ai-marker-smokes-15j.mjs
      - .github/workflows/temp-ai-marker-smoke-update-15j.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ai-compat-marker-retirement-20260814
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update provider smokes to real-key storage
        run: node scripts/update-ai-marker-smokes-15j.mjs
      - name: Validate updated provider smokes
        run: |
          node scripts/ai-request-api-smoke.mjs
          node scripts/ai-provider-routing-smoke.mjs
          node scripts/ai-fetch-wrapper-removal-smoke.mjs
          node scripts/ai-compat-marker-retirement-smoke.mjs
          git diff --check
      - name: Commit permanent smoke updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ai-request-api-smoke.mjs scripts/ai-provider-routing-smoke.mjs scripts/ai-fetch-wrapper-removal-smoke.mjs
          if git diff --cached --quiet; then
            echo "No provider smoke updates produced." >&2
            exit 1
          fi
          git commit -m "Update AI provider smokes for marker-free storage"
          git push origin HEAD:cleanup/ai-compat-marker-retirement-20260814
