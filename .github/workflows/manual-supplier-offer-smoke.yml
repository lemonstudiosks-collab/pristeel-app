name: Manual Supplier Offer Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-supplier-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax
        run: node --check pristeel-manual-supplier-offer-v1.js
      - name: Simplified project-commercial regression
        run: node tests/manual-supplier-offer-simplified-smoke.js
