name: Workspace V2 Safe Check

on:
  push:
    branches:
      - workspace-v2-safe-build
    paths-ignore:
      - 'DEPLOYMENT_STATUS.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'DEPLOYMENT_STATUS.md'

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run workspace checks
        run: npm test
      - name: Dispatch verified preview deployment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'workspace-v2-safe-build'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-preview-pages.yml/dispatches" \
            -d '{"ref":"workspace-v2-safe-build"}'
