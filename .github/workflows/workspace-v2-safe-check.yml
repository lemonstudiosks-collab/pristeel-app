name: Workspace V2 Safe Check

on:
  push:
    branches:
      - workspace-v2-safe-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run workspace checks
        run: npm test

  hubspot-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'workspace-v2-safe-build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN || secrets.HUBSPOT_PRIVATE_APP_TOKEN || secrets.HUBSPOT_TOKEN }}
      HUBSPOT_PORTAL_ID: '147958987'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://isymxqfqzkchbsrbhucf.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect credentials
        id: credential
        shell: bash
        run: |
          if [ -z "$HUBSPOT_ACCESS_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HubSpot token is not configured."
          elif [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase server-side key is not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize HubSpot contacts and deals
        if: steps.credential.outputs.available == 'true'
        run: node scripts/hubspot-sync.mjs
