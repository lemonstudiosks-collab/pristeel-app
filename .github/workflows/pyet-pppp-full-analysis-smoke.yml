name: Pyet PPPP full analysis smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check source syntax
        run: node --check pristeel-pyet-pppp-full-analysis-v1.js && node --check pristeel-home-live-fix-v1.js
      - name: Run rich read routing smoke
        run: node tests/pyet-pppp-full-analysis-smoke.js
