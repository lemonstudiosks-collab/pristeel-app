name: Opportunity Gmail registry production acceptance

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260907125000_opportunity_action_gmail_registry_preservation_v2.sql'
      - 'scripts/opportunity-gmail-registry-production-acceptance.mjs'
      - '.github/workflows/opportunity-gmail-registry-production-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-gmail-registry-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://isymxqfqzkchbsrbhucf.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      PPPP_SYNC_EMAIL: ${{ secrets.PPPP_SYNC_EMAIL }}
      PPPP_SYNC_PASSWORD: ${{ secrets.PPPP_SYNC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check isolated registry acceptance
        run: node --check scripts/opportunity-gmail-registry-production-acceptance.mjs
      - name: Allow production migration deployment to settle
        run: sleep 20
      - name: Run isolated production registry acceptance
        run: node scripts/opportunity-gmail-registry-production-acceptance.mjs
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-gmail-registry-production-acceptance
          path: tmp/opportunity-gmail-registry-production-acceptance.json
          if-no-files-found: warn
          retention-days: 14
