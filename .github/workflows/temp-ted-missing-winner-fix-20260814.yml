name: TEMP TED missing-winner fix

# Rerun after correcting the regression fixture index.
on:
  push:
    branches: [fix/ted-missing-winner-operational-focus-20260814]
    paths:
      - '.github/workflows/temp-ted-missing-winner-fix-20260814.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ted-missing-winner-operational-focus-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply targeted patch
        run: node scripts/temp-fix-ted-missing-winner-20260814.mjs
      - name: Run tender regression smoke
        run: node tests/tender-business-flow-smoke.js
      - name: Run full suite
        run: npm test
      - name: Validate repository diff
        run: git diff --check
      - name: Commit tested runtime and smoke changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pristeel-tender-business-flow-v1.js tests/tender-business-flow-smoke.js
          git diff --cached --quiet && exit 0
          git commit -m "Treat TED awards without winners as intelligence-only"
          git push origin HEAD:fix/ted-missing-winner-operational-focus-20260814
