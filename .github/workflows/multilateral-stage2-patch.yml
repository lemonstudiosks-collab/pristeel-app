name: Multilateral stage2 guarded patch

on:
  push:
    branches:
      - feat/tender-sources-multilateral-20260912
    paths:
      - .github/workflows/multilateral-stage2-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tender-sources-multilateral-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded source-filter patch
        run: node scripts/apply-multilateral-opportunities-stage2.mjs
      - name: Verify syntax and source tests
        run: |
          node --check pristeel-project-centric-workflow-v1.js
          node tests/multilateral-opportunities-source-smoke.js
          node --check scripts/multilateral-procurement-core.mjs
          node --check scripts/multilateral-procurement-sync.mjs
      - name: Commit guarded patch
        shell: bash
        run: |
          if git diff --quiet -- pristeel-project-centric-workflow-v1.js; then
            echo 'No Opportunities patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pristeel-project-centric-workflow-v1.js
          git commit -m 'Expose multilateral procurement sources in Opportunities'
          git push origin HEAD:feat/tender-sources-multilateral-20260912
