name: TEMP Inline AI audit 15E1

on:
  push:
    branches:
      - cleanup/ai-inline-startparsing-20260814
    paths:
      - .github/workflows/temp-inline-ai-audit-15e1.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/ai-inline-startparsing-20260814

      - name: Extract startParsing function with line numbers
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('pristeel-procurement.html','utf8');
          const needle='async function startParsing()';
          const start=src.indexOf(needle);
          if(start<0) throw new Error('startParsing not found');
          const brace=src.indexOf('{',start);
          let depth=0, quote='', escaped=false, lineComment=false, blockComment=false, end=-1;
          for(let i=brace;i<src.length;i++){
            const ch=src[i], nx=src[i+1]||'';
            if(lineComment){ if(ch==='\n') lineComment=false; continue; }
            if(blockComment){ if(ch==='*'&&nx==='/'){ blockComment=false; i++; } continue; }
            if(quote){
              if(escaped){ escaped=false; continue; }
              if(ch==='\\'){ escaped=true; continue; }
              if(ch===quote) quote='';
              continue;
            }
            if(ch==='/'&&nx==='/'){ lineComment=true; i++; continue; }
            if(ch==='/'&&nx==='*'){ blockComment=true; i++; continue; }
            if(ch==='"'||ch==="'"||ch==='`'){ quote=ch; continue; }
            if(ch==='{') depth++;
            else if(ch==='}'){
              depth--;
              if(depth===0){ end=i+1; break; }
            }
          }
          if(end<0) throw new Error('startParsing closing brace not found');
          const before=src.slice(0,start);
          const startLine=before.split('\n').length;
          const body=src.slice(start,end);
          const lines=body.split('\n');
          console.log(`START_LINE=${startLine}`);
          console.log(`END_LINE=${startLine+lines.length-1}`);
          console.log(`DIRECT_GROQ_ENDPOINTS=${(body.match(/api\.groq\.com\/openai\/v1\/chat\/completions/g)||[]).length}`);
          console.log(`DIRECT_LEGACY_KEYS=${(body.match(/pristeel_apikey/g)||[]).length}`);
          console.log('--- FUNCTION START ---');
          lines.forEach((line,i)=>console.log(String(startLine+i).padStart(6,' ')+': '+line));
          console.log('--- FUNCTION END ---');
          NODE
