name: TED award winner monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ted-award-winner-sync.mjs'
      - 'tests/ted-award-winner-sync-smoke.mjs'
      - 'pristeel-tender-business-flow-v1.js'
      - 'tests/tender-business-flow-smoke.js'
      - 'pristeel-roles.js'
      - '.github/workflows/ted-tender-sync.yml'
  schedule:
    - cron: '47 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/ted-award-winner-sync.mjs'
      - 'pristeel-tender-business-flow-v1.js'
      - 'pristeel-roles.js'
      - '.github/workflows/ted-tender-sync.yml'

permissions:
  contents: read

concurrency:
  group: ted-award-winner-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://isymxqfqzkchbsrbhucf.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      PPPP_SYNC_EMAIL: ${{ secrets.PPPP_SYNC_EMAIL }}
      PPPP_SYNC_PASSWORD: ${{ secrets.PPPP_SYNC_PASSWORD }}
      TED_TENDER_MIN_SCORE: '75'
      TED_AWARD_DAYS: '30'
      SYNC_MODE: ${{ github.event_name == 'pull_request' && 'preview' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'apply') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install UI test dependency
        run: npm install --no-audit --no-fund

      - name: Check award collector and UI syntax
        run: |
          node --check scripts/ted-award-winner-sync.mjs
          node --check pristeel-tender-business-flow-v1.js

      - name: Run TED award winner smoke
        run: node tests/ted-award-winner-sync-smoke.mjs

      - name: Run tender business flow smoke
        run: node tests/tender-business-flow-smoke.js

      - name: Collect awarded TED steel contracts and winners
        run: node scripts/ted-award-winner-sync.mjs

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ted-award-winner-monitor
          path: tmp/ted-award-winner-sync.json
          if-no-files-found: ignore
          retention-days: 14
