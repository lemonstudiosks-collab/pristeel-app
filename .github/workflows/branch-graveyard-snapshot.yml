name: PPPP branch graveyard snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-graveyard-snapshot.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Guard audited repository state
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BEFORE: 62be8a6447fafd2f12da273d2196eb97a231d8e4
          EXPECTED_TOTAL_BRANCHES: "254"
          EXPECTED_STABLE_BRANCHES: "252"
          EXPECTED_DELETE_CANDIDATES: "239"
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event.before }}" != "$EXPECTED_BEFORE" ]]; then
            echo "ABORT: push baseline changed. expected=$EXPECTED_BEFORE actual=${{ github.event.before }}" >&2
            exit 1
          fi

          mkdir -p branch-graveyard-snapshot

          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[] | [.name, .commit.sha, (.protected|tostring)] | @tsv' \
            | sort > branch-graveyard-snapshot/all-branches.tsv

          total="$(wc -l < branch-graveyard-snapshot/all-branches.tsv | tr -d ' ')"
          if [[ "$total" != "$EXPECTED_TOTAL_BRANCHES" ]]; then
            echo "ABORT: branch count changed. expected=$EXPECTED_TOTAL_BRANCHES actual=$total" >&2
            exit 1
          fi

          open_prs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number' | wc -l | tr -d ' ')"
          if [[ "$open_prs" != "0" ]]; then
            echo "ABORT: expected zero open PRs after merge, found $open_prs" >&2
            exit 1
          fi

          cat > branch-graveyard-snapshot/hold-branches.txt <<'EOF'
          backup-main-before-audited-release-20260807-2000
          backup-before-stable-rollback-2026-08-04
          backup/workspace-rebuild-20260804
          backup-main-before-redesign-publish-20260807
          verify/live-redesign-20260807-10
          verify/workspace-v2-current-20260807
          verify-document-center-actions-20260808
          verify-first-login-20260807
          release/workspace-production-v2
          release/workspace-stable-20260804
          repair/workspace-v2-stabilize
          feature-ted-tender-monitor-20260814
          fix-login-project-readability-20260812
          fix-project-drive-cross-device-20260812
          EOF
          sed -i 's/^          //' branch-graveyard-snapshot/hold-branches.txt
          sort -o branch-graveyard-snapshot/hold-branches.txt branch-graveyard-snapshot/hold-branches.txt

          awk -F '\t' '$1 != "main" && $1 !~ /^cleanup\/branch-graveyard-/ {print $1 "\t" $2}' \
            branch-graveyard-snapshot/all-branches.tsv \
            | sort > branch-graveyard-snapshot/stable-inventory.tsv

          stable_count="$(wc -l < branch-graveyard-snapshot/stable-inventory.tsv | tr -d ' ')"
          if [[ "$stable_count" != "$EXPECTED_STABLE_BRANCHES" ]]; then
            echo "ABORT: stable audited inventory changed. expected=$EXPECTED_STABLE_BRANCHES actual=$stable_count" >&2
            exit 1
          fi

          cut -f1 branch-graveyard-snapshot/stable-inventory.tsv | sort > branch-graveyard-snapshot/stable-names.txt
          missing_holds="$(comm -23 branch-graveyard-snapshot/hold-branches.txt branch-graveyard-snapshot/stable-names.txt || true)"
          if [[ -n "$missing_holds" ]]; then
            echo "ABORT: HOLD branches missing:" >&2
            echo "$missing_holds" >&2
            exit 1
          fi

          awk -F '\t' '{print $1}' branch-graveyard-snapshot/all-branches.tsv | sort > branch-graveyard-snapshot/all-names.txt
          comm -23 branch-graveyard-snapshot/all-names.txt <(printf '%s\n' main; cat branch-graveyard-snapshot/hold-branches.txt | sort) \
            | sort > branch-graveyard-snapshot/delete-candidates.txt

          delete_count="$(wc -l < branch-graveyard-snapshot/delete-candidates.txt | tr -d ' ')"
          if [[ "$delete_count" != "$EXPECTED_DELETE_CANDIDATES" ]]; then
            echo "ABORT: delete candidate count mismatch. expected=$EXPECTED_DELETE_CANDIDATES actual=$delete_count" >&2
            exit 1
          fi

          if grep -Fxq 'main' branch-graveyard-snapshot/delete-candidates.txt; then
            echo "ABORT: main appeared in deletion candidates" >&2
            exit 1
          fi

          protected_delete="$(awk -F '\t' 'NR==FNR {d[$1]=1; next} ($1 in d) && $3=="true" {print $1}' \
            branch-graveyard-snapshot/delete-candidates.txt branch-graveyard-snapshot/all-branches.tsv || true)"
          if [[ -n "$protected_delete" ]]; then
            echo "ABORT: protected branch appeared in deletion candidates:" >&2
            echo "$protected_delete" >&2
            exit 1
          fi

          digest="$(sha256sum branch-graveyard-snapshot/stable-inventory.tsv | awk '{print $1}')"
          printf '%s\n' "$digest" > branch-graveyard-snapshot/stable-inventory.sha256

          {
            echo "### Branch graveyard snapshot"
            echo "- baseline before push: $EXPECTED_BEFORE"
            echo "- total refs: $total"
            echo "- stable audited refs (excluding main + cleanup executor): $stable_count"
            echo "- HOLD refs: 14"
            echo "- deletion candidates for this snapshot: $delete_count"
            echo "- stable inventory SHA-256: \`$digest\`"
            echo "- deletion performed: **NO**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload branch graveyard snapshot
        uses: actions/upload-artifact@v4
        with:
          name: branch-graveyard-snapshot
          path: branch-graveyard-snapshot/
          if-no-files-found: error
          retention-days: 7
