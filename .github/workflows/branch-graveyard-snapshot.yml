name: PPPP branch graveyard cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-graveyard-snapshot.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify audited inventory and delete SAFE refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BEFORE: 3ce05a9279533fa73a0b38c4f78bc846dc8b98b1
          EXPECTED_TOTAL_BRANCHES: "256"
          EXPECTED_STABLE_BRANCHES: "252"
          EXPECTED_DELETE_CANDIDATES: "241"
          EXPECTED_STABLE_DIGEST: 046542d899fa9276306ce2421f5c919d07474dbecf6ea7ba0eb96e77294cd6af
          CANARY_BRANCH: cleanup/branch-graveyard-snapshot-20260814
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event.before }}" != "$EXPECTED_BEFORE" ]]; then
            echo "ABORT: push baseline changed. expected=$EXPECTED_BEFORE actual=${{ github.event.before }}" >&2
            exit 1
          fi

          mkdir -p branch-graveyard-cleanup

          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[] | [.name, .commit.sha, (.protected|tostring)] | @tsv' \
            | sort > branch-graveyard-cleanup/all-branches-before.tsv

          total="$(wc -l < branch-graveyard-cleanup/all-branches-before.tsv | tr -d ' ')"
          if [[ "$total" != "$EXPECTED_TOTAL_BRANCHES" ]]; then
            echo "ABORT: branch count changed. expected=$EXPECTED_TOTAL_BRANCHES actual=$total" >&2
            exit 1
          fi

          open_prs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number' | wc -l | tr -d ' ')"
          if [[ "$open_prs" != "0" ]]; then
            echo "ABORT: expected zero open PRs after merge, found $open_prs" >&2
            exit 1
          fi

          cat > branch-graveyard-cleanup/hold-branches.txt <<'EOF'
          backup-main-before-audited-release-20260807-2000
          backup-before-stable-rollback-2026-08-04
          backup/workspace-rebuild-20260804
          backup-main-before-redesign-publish-20260807
          verify/live-redesign-20260807-10
          verify/workspace-v2-current-20260807
          verify-document-center-actions-20260808
          verify-first-login-20260807
          release/workspace-production-v2
          release/workspace-stable-20260804
          repair/workspace-v2-stabilize
          feature-ted-tender-monitor-20260814
          fix-login-project-readability-20260812
          fix-project-drive-cross-device-20260812
          EOF
          sed -i 's/^          //' branch-graveyard-cleanup/hold-branches.txt
          sort -o branch-graveyard-cleanup/hold-branches.txt branch-graveyard-cleanup/hold-branches.txt

          awk -F '\t' '$1 != "main" && $1 !~ /^cleanup\/branch-graveyard-/ {print $1 "\t" $2}' \
            branch-graveyard-cleanup/all-branches-before.tsv \
            | sort > branch-graveyard-cleanup/stable-inventory.tsv

          stable_count="$(wc -l < branch-graveyard-cleanup/stable-inventory.tsv | tr -d ' ')"
          if [[ "$stable_count" != "$EXPECTED_STABLE_BRANCHES" ]]; then
            echo "ABORT: stable audited inventory count changed. expected=$EXPECTED_STABLE_BRANCHES actual=$stable_count" >&2
            exit 1
          fi

          digest="$(sha256sum branch-graveyard-cleanup/stable-inventory.tsv | awk '{print $1}')"
          if [[ "$digest" != "$EXPECTED_STABLE_DIGEST" ]]; then
            echo "ABORT: audited branch name/SHA fingerprint changed." >&2
            echo "expected=$EXPECTED_STABLE_DIGEST" >&2
            echo "actual=$digest" >&2
            exit 1
          fi
          printf '%s\n' "$digest" > branch-graveyard-cleanup/stable-inventory.sha256

          cut -f1 branch-graveyard-cleanup/stable-inventory.tsv | sort > branch-graveyard-cleanup/stable-names.txt
          missing_holds="$(comm -23 branch-graveyard-cleanup/hold-branches.txt branch-graveyard-cleanup/stable-names.txt || true)"
          if [[ -n "$missing_holds" ]]; then
            echo "ABORT: HOLD branches missing:" >&2
            echo "$missing_holds" >&2
            exit 1
          fi

          awk -F '\t' '{print $1}' branch-graveyard-cleanup/all-branches-before.tsv | sort > branch-graveyard-cleanup/all-names-before.txt
          { printf '%s\n' main; cat branch-graveyard-cleanup/hold-branches.txt; } | sort > branch-graveyard-cleanup/keep-names.txt
          comm -23 branch-graveyard-cleanup/all-names-before.txt branch-graveyard-cleanup/keep-names.txt \
            | sort > branch-graveyard-cleanup/delete-candidates.txt

          delete_count="$(wc -l < branch-graveyard-cleanup/delete-candidates.txt | tr -d ' ')"
          if [[ "$delete_count" != "$EXPECTED_DELETE_CANDIDATES" ]]; then
            echo "ABORT: delete candidate count mismatch. expected=$EXPECTED_DELETE_CANDIDATES actual=$delete_count" >&2
            exit 1
          fi

          if grep -Fxq 'main' branch-graveyard-cleanup/delete-candidates.txt; then
            echo "ABORT: main appeared in deletion candidates" >&2
            exit 1
          fi

          if ! grep -Fxq "$CANARY_BRANCH" branch-graveyard-cleanup/delete-candidates.txt; then
            echo "ABORT: canary branch is not in deletion candidates: $CANARY_BRANCH" >&2
            exit 1
          fi

          protected_delete="$(awk -F '\t' 'NR==FNR {d[$1]=1; next} ($1 in d) && $3=="true" {print $1}' \
            branch-graveyard-cleanup/delete-candidates.txt branch-graveyard-cleanup/all-branches-before.tsv || true)"
          if [[ -n "$protected_delete" ]]; then
            echo "ABORT: protected branch appeared in deletion candidates:" >&2
            echo "$protected_delete" >&2
            exit 1
          fi

          echo "Preflight complete. Fingerprint verified. Testing ref-delete permission on canary: $CANARY_BRANCH"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CANARY_BRANCH"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CANARY_BRANCH" >/dev/null 2>&1; then
            echo "ABORT: canary branch still exists after DELETE" >&2
            exit 1
          fi
          echo "Canary deletion verified. Proceeding with remaining audited SAFE refs."

          grep -Fxv "$CANARY_BRANCH" branch-graveyard-cleanup/delete-candidates.txt > branch-graveyard-cleanup/delete-remaining.txt
          : > branch-graveyard-cleanup/deleted.txt
          : > branch-graveyard-cleanup/delete-failures.txt

          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1; then
              printf '%s\n' "$branch" >> branch-graveyard-cleanup/deleted.txt
            else
              printf '%s\n' "$branch" >> branch-graveyard-cleanup/delete-failures.txt
            fi
          done < branch-graveyard-cleanup/delete-remaining.txt

          printf '%s\n' "$CANARY_BRANCH" >> branch-graveyard-cleanup/deleted.txt
          sort -o branch-graveyard-cleanup/deleted.txt branch-graveyard-cleanup/deleted.txt

          if [[ -s branch-graveyard-cleanup/delete-failures.txt ]]; then
            echo "ERROR: some audited SAFE refs could not be deleted:" >&2
            cat branch-graveyard-cleanup/delete-failures.txt >&2
            exit 1
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' \
            | sort > branch-graveyard-cleanup/all-names-after.txt
          { printf '%s\n' main; cat branch-graveyard-cleanup/hold-branches.txt; } \
            | sort > branch-graveyard-cleanup/expected-after.txt

          if ! diff -u branch-graveyard-cleanup/expected-after.txt branch-graveyard-cleanup/all-names-after.txt; then
            echo "ERROR: final branch set is not exactly main + 14 HOLD refs" >&2
            exit 1
          fi

          after_count="$(wc -l < branch-graveyard-cleanup/all-names-after.txt | tr -d ' ')"
          deleted_count="$(wc -l < branch-graveyard-cleanup/deleted.txt | tr -d ' ')"
          if [[ "$after_count" != "15" || "$deleted_count" != "$EXPECTED_DELETE_CANDIDATES" ]]; then
            echo "ERROR: final counts mismatch. after=$after_count deleted=$deleted_count" >&2
            exit 1
          fi

          {
            echo "### Branch graveyard cleanup"
            echo "- audited stable fingerprint: \`$digest\`"
            echo "- deleted refs: **$deleted_count**"
            echo "- remaining refs: **$after_count**"
            echo "- remaining set: main + 14 HOLD refs"
            echo "- application/runtime files changed by this job: **0**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload branch graveyard cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-graveyard-cleanup-report
          path: branch-graveyard-cleanup/
          if-no-files-found: warn
          retention-days: 14
