name: HubSpot CRM Sync

# Re-triggered after HUBSPOT_ACCESS_TOKEN and SUPABASE_SECRET_KEY were configured on 2026-08-05.
on:
  push:
    branches:
      - workspace-v2-safe-build
    paths:
      - 'scripts/hubspot-sync.mjs'
      - 'scripts/project-data-reconcile.mjs'
      - '.github/workflows/hubspot-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: hubspot-crm-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN || secrets.HUBSPOT_PRIVATE_APP_TOKEN || secrets.HUBSPOT_TOKEN }}
      HUBSPOT_PORTAL_ID: '147958987'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://isymxqfqzkchbsrbhucf.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workspace-v2-safe-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect credentials
        id: credential
        shell: bash
        run: |
          if [ -z "$HUBSPOT_ACCESS_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HubSpot token is not configured."
          elif [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase server-side key is not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize contacts and deals
        if: steps.credential.outputs.available == 'true'
        run: node scripts/hubspot-sync.mjs

      - name: Reconcile project records
        if: steps.credential.outputs.available == 'true'
        env:
          APPLY: 'true'
        run: node scripts/project-data-reconcile.mjs | tee project-reconcile-report.json

      - name: Build readable reconciliation report
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let raw=''; try{raw=fs.readFileSync('project-reconcile-report.json','utf8')}catch(e){}
          const start=raw.indexOf('{'); const end=raw.lastIndexOf('}');
          let data={}; try{data=JSON.parse(raw.slice(start,end+1))}catch(e){data={error:String(e),raw:raw.slice(-4000)}}
          const lines=['# Project data reconciliation','','Generated: '+new Date().toISOString(),'','Projects scanned: '+(data.projects??'unknown'),'Records linked: '+((data.applied||[]).length),'Unresolved records: '+((data.unresolved||[]).length),'Conflicts left untouched: '+((data.conflicts||[]).length),'','## Tables'];
          for(const [name,stats] of Object.entries(data.tables||{})) lines.push(`- ${name}: ${JSON.stringify(stats)}`);
          lines.push('','## Linked records');
          for(const row of (data.applied||[]).slice(0,300)) lines.push(`- ${row.table} / ${row.id} -> ${row.project} (${row.projectId}), score ${row.score}`);
          lines.push('','## Unresolved records');
          for(const row of (data.unresolved||[]).slice(0,300)) lines.push(`- ${row.table} / ${row.id}: ${row.label||'(no label)'}; candidates ${JSON.stringify(row.candidates||[])}`);
          lines.push('','## Conflicts not changed');
          for(const row of (data.conflicts||[]).slice(0,300)) lines.push(`- ${row.table} / ${row.id}: current ${row.currentProjectId}, suggested ${row.suggestedProjectId}, score ${row.score}`);
          fs.writeFileSync('PROJECT_DATA_RECONCILIATION.md',lines.join('\n'));
          NODE

      - name: Commit reconciliation report
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_DATA_RECONCILIATION.md
          git diff --cached --quiet || git commit -m "Update project data reconciliation report"
          git push origin HEAD:workspace-v2-safe-build

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-reconcile-report
          path: |
            project-reconcile-report.json
            PROJECT_DATA_RECONCILIATION.md
          retention-days: 14
