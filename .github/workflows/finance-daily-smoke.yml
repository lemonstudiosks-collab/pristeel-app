name: Finance daily work surface smoke

on:
  pull_request:
    paths:
      - 'pristeel-finance-daily-v1.js'
      - 'pristeel-daily-zones-cleanup-v1.js'
      - 'tests/finance-daily-smoke.js'
      - '.github/workflows/finance-daily-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'pristeel-finance-daily-v1.js'
      - 'pristeel-daily-zones-cleanup-v1.js'
      - 'tests/finance-daily-smoke.js'
      - '.github/workflows/finance-daily-smoke.yml'

jobs:
  finance-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check pristeel-finance-daily-v1.js
      - run: node tests/finance-daily-smoke.js
