name: Apply EVOSYS click-scope fix

on:
  push:
    branches:
      - fix/project-workflow-click-scope-20260906
    paths:
      - '.github/workflows/apply-evosys-click-scope-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-workflow-click-scope-20260906
          fetch-depth: 0

      - name: Patch only project workflow click scope and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('pristeel-project-workflow-canonical-v1.js')
          text = workflow.read_text()
          old = "  if(!t)return;\n  if(t.hasAttribute('data-pwf-area')){"
          new = "  if(!t||t.id==='page-workspace-project')return;\n  if(t.hasAttribute('data-pwf-area')){"
          if text.count(old) != 1:
              raise SystemExit(f'canonical click marker count={text.count(old)}; refusing patch')
          workflow.write_text(text.replace(old, new, 1))

          test = Path('tests/manual-supplier-offer-simplified-smoke.js')
          t = test.read_text()
          marker = "  const source=fs.readFileSync('pristeel-manual-supplier-offer-v1.js','utf8');\n"
          addition = marker + "  const workflowSource=fs.readFileSync('pristeel-project-workflow-canonical-v1.js','utf8');\n  assert(workflowSource.includes(\"if(!t||t.id==='page-workspace-project')return;\"),'Canonical project workflow must not treat the workspace state root as a clickable workflow control');\n"
          if t.count(marker) != 1:
              raise SystemExit(f'manual supplier smoke marker count={t.count(marker)}; refusing test patch')
          test.write_text(t.replace(marker, addition, 1))
          PY

      - name: Verify syntax and focused regression
        run: |
          node --check pristeel-project-workflow-canonical-v1.js
          node --check pristeel-manual-supplier-offer-v1.js
          npm install --no-audit --no-fund
          node tests/manual-supplier-offer-simplified-smoke.js

      - name: Commit isolated product fix
        run: |
          git config user.name 'lemonstudiosks-collab'
          git config user.email 'lemonstudios.ks@gmail.com'
          git add pristeel-project-workflow-canonical-v1.js tests/manual-supplier-offer-simplified-smoke.js
          git diff --cached --check
          git commit -m 'Fix project workflow click scope for manual supplier offer'
          git push origin HEAD:fix/project-workflow-click-scope-20260906
