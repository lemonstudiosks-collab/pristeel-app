name: TEMP Cleanup 15G AI Settings ownership

on:
  push:
    branches:
      - cleanup/ai-settings-ownership-20260814
    paths:
      - scripts/apply-ai-settings-ownership-15g.mjs
      - .github/workflows/temp-ai-settings-ownership-15g.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ai-settings-ownership-20260814
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Settings ownership migration
        run: node scripts/apply-ai-settings-ownership-15g.mjs
      - name: Validate isolated ownership migration
        run: |
          node scripts/ai-settings-ownership-smoke.mjs
          node scripts/project-analysis-ai-smoke.mjs
          node scripts/q-analyze-batch-ai-smoke.mjs
          node scripts/q-analyze-offer-ai-smoke.mjs
          node scripts/parse-offer-ai-smoke.mjs
          node scripts/start-parsing-ai-smoke.mjs
          node scripts/runtime-manifest-check.mjs
          node scripts/bootstrap-sequence-check.mjs
          node scripts/generate-bootstrap.mjs --check
          git diff --check
      - name: Commit runtime migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pristeel-procurement.html runtime-manifest.json
          if git diff --cached --quiet; then
            echo "No Settings ownership migration produced." >&2
            exit 1
          fi
          git commit -m "Delegate base AI Settings storage to PSTAI"
          git push origin HEAD:cleanup/ai-settings-ownership-20260814
