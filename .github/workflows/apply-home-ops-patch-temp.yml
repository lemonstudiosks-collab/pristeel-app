name: TEMP apply isolated Home/create source patch
on:
  push:
    branches:
      - home-ops-create-structural-20260908
    paths:
      - tools/home-ops-patches/READY
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited source hunks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def apply_patch(path):
              lines=Path(path).read_text(encoding='utf-8').splitlines(keepends=True)
              target=None
              for line in lines:
                  if line.startswith('+++ b/'):
                      target=line[6:].strip()
                      break
              if not target:
                  raise SystemExit(f'{path}: missing target')
              text=Path(target).read_text(encoding='utf-8')
              starts=[i for i,l in enumerate(lines) if l.startswith('@@')]
              if not starts:
                  raise SystemExit(f'{path}: no hunks')
              starts.append(len(lines))
              for h in range(len(starts)-1):
                  block=lines[starts[h]+1:starts[h+1]]
                  old=[]; new=[]
                  for l in block:
                      if l.startswith('\\ No newline'):
                          continue
                      if l.startswith(' '):
                          old.append(l[1:]); new.append(l[1:])
                      elif l.startswith('-') and not l.startswith('---'):
                          old.append(l[1:])
                      elif l.startswith('+') and not l.startswith('+++'):
                          new.append(l[1:])
                  old_s=''.join(old); new_s=''.join(new)
                  if not old_s:
                      raise SystemExit(f'{path}: empty old hunk {h+1}')
                  n=text.count(old_s)
                  if n != 1:
                      raise SystemExit(f'{path}: hunk {h+1} old block matches {n} times in {target}')
                  text=text.replace(old_s,new_s,1)
              Path(target).write_text(text,encoding='utf-8')
              print(f'Applied {path} -> {target}')

          for p in sorted(Path('tools/home-ops-patches').glob('*.patch')):
              apply_patch(p)
          PY
      - name: Verify isolated source syntax
        run: |
          set -euo pipefail
          node --check pristeel-workspace-architecture-v1.js
          node --check pristeel-native-ui-v3.js
          node --check pristeel-native-ui-v4-core.js
          node --check pristeel-platform-readability-v1.js
      - name: Commit isolated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pristeel-workspace-architecture-v1.js pristeel-native-ui-v3.js pristeel-native-ui-v4-core.js pristeel-platform-readability-v1.js
          git commit -m "Structural create owner and operational Home"
          git push
