name: TEMP apply isolated Home/create source patch
on:
  push:
    branches:
      - home-ops-create-structural-20260908
    paths:
      - tools/home-ops-patches/READY
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited source hunks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, difflib

          def apply_patch(path):
              plines=Path(path).read_text(encoding='utf-8').splitlines(keepends=True)
              target=next((line[6:].strip() for line in plines if line.startswith('+++ b/')),None)
              if not target: raise SystemExit(f'{path}: missing target')
              src=Path(target).read_text(encoding='utf-8').splitlines(keepends=True)
              starts=[i for i,l in enumerate(plines) if l.startswith('@@')]
              if not starts: raise SystemExit(f'{path}: no hunks')
              starts.append(len(plines)); hunks=[]
              for h in range(len(starts)-1):
                  header=plines[starts[h]]
                  m=re.match(r'@@ -(\d+)(?:,(\d+))? \+\d+(?:,\d+)? @@',header)
                  if not m: raise SystemExit(f'{path}: bad hunk header {header.strip()}')
                  old_start=int(m.group(1)); old_count=int(m.group(2) or 1)
                  old=[]; new=[]
                  for l in plines[starts[h]+1:starts[h+1]]:
                      if l.startswith('\\ No newline'): continue
                      if l.rstrip('\n')=='-})();+})();': old.append('})();\n'); new.append('})();\n'); continue
                      if l.startswith(' '): old.append(l[1:]); new.append(l[1:])
                      elif l.startswith('-') and not l.startswith('---'): old.append(l[1:])
                      elif l.startswith('+') and not l.startswith('+++'): new.append(l[1:])
                  if old==new:
                      print(f'Skip no-op hunk {h+1}: {path}'); continue
                  if not old: raise SystemExit(f'{path}: empty old hunk {h+1}')
                  hunks.append((old_start,old_count,h+1,old,new))
              for old_start,old_count,hnum,old,new in sorted(hunks,key=lambda x:x[0],reverse=True):
                  old_s=''.join(old); full=''.join(src)
                  if full.count(old_s)==1:
                      pos=full.index(old_s); prefix=full[:pos].splitlines(keepends=True); replacement=''.join(new)
                      full=full[:pos]+replacement+full[pos+len(old_s):]
                      src=full.splitlines(keepends=True); continue
                  best=None
                  expected=max(0,old_start-1)
                  for st in range(max(0,expected-6),min(len(src),expected+7)):
                      for ln in range(max(1,old_count-6),min(len(src)-st,old_count+6)+1):
                          cand=src[st:st+ln]
                          ratio=difflib.SequenceMatcher(None,old,cand,autojunk=False).ratio()
                          if best is None or ratio>best[0]: best=(ratio,st,ln)
                  if not best or best[0]<0.66:
                      raise SystemExit(f'{path}: hunk {hnum} unmatched; best={best[0] if best else 0:.3f} in {target}')
                  ratio,st,ln=best
                  print(f'Bounded hunk {hnum}: {path} ratio={ratio:.3f} lines={st+1}:{st+ln}')
                  src[st:st+ln]=new
              Path(target).write_text(''.join(src),encoding='utf-8')
              print(f'Applied {path} -> {target}')

          for p in sorted(Path('tools/home-ops-patches').glob('*.patch')): apply_patch(p)
          PY
      - name: Verify isolated source syntax
        run: |
          set -euo pipefail
          node --check pristeel-workspace-architecture-v1.js
          node --check pristeel-native-ui-v3.js
          node --check pristeel-native-ui-v4-core.js
          node --check pristeel-platform-readability-v1.js
      - name: Commit isolated source changes and remove temporary scaffolding
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pristeel-workspace-architecture-v1.js pristeel-native-ui-v3.js pristeel-native-ui-v4-core.js pristeel-platform-readability-v1.js
          git rm -f .github/workflows/apply-home-ops-patch-temp.yml tools/home-ops-patches/*
          git commit -m "Structural create owner and operational Home"
          git push
