name: PPPP one-shot test registration

on:
  push:
    branches:
      - pppp/task-lifecycle-home-priority-20260825

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pppp/task-lifecycle-home-priority-20260825
          fetch-depth: 0
      - name: Register focused smoke tests in npm test
        shell: python
        run: |
          from pathlib import Path
          p=Path('package.json')
          s=p.read_text()
          marker='node tests/home-human-needed-priority-smoke.js'
          if marker not in s:
              old='&& node tests/project-data-reconcile-smoke.mjs\"'
              new='&& node tests/project-data-reconcile-smoke.mjs && node tests/home-human-needed-priority-smoke.js && node tests/task-lifecycle-reconcile-smoke.mjs\"'
              if old not in s:
                  raise SystemExit('package test anchor not found')
              s=s.replace(old,new,1)
              p.write_text(s)
      - name: Validate registered tests
        run: |
          node tests/home-human-needed-priority-smoke.js
          node tests/task-lifecycle-reconcile-smoke.mjs
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package json OK')"
      - name: Commit package test registration
        run: |
          if git diff --quiet -- package.json; then
            echo "Already registered"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "test: register lifecycle and Home priority smokes"
          git push origin HEAD:pppp/task-lifecycle-home-priority-20260825
