name: Bitrix24 to PPPP existing contact update dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare existing Bitrix24 contacts with PPPP
        env:
          BITRIX_HOST: b24-cl53os.bitrix24.com
          BITRIX_LOGIN: sales@prissteel.com
          BITRIX_APP_PASSWORD: ${{ secrets.BITRIX_APP_PASSWORD }}
          PPPP_SYNC_EMAIL: ${{ secrets.PPPP_SYNC_EMAIL }}
          PPPP_SYNC_PASSWORD: ${{ secrets.PPPP_SYNC_PASSWORD }}
        run: node scripts/bitrix-pppp-update-dryrun.mjs

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitrix-pppp-update-dryrun
          path: tmp/bitrix-pppp-update-dryrun.json
          if-no-files-found: ignore
          retention-days: 3
