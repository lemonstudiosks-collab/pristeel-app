name: PPPP Balanced UI smoke

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balanced-ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check balanced UI
        run: node --check pristeel-ui-balanced-v1.js
      - name: Presentation safety smoke
        run: node tests/ui-balanced-v1-smoke.js
      - name: Preview contract smoke
        run: |
          grep -q "PPPP COMMAND CENTER" pppp-ui-standard-v1-preview.html
          grep -q "Automation & platform health" pppp-ui-standard-v1-preview.html
          grep -q "TED Sales Outreach" pppp-ui-standard-v1-preview.html
          grep -q "Financial control" pppp-ui-standard-v1-preview.html
