name: Bitrix24 to PPPP fill existing contacts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or apply fill-only updates to existing PPPP contacts
        required: true
        type: choice
        options:
          - preview
          - apply
        default: preview

permissions:
  contents: read

jobs:
  fill-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fill empty fields on existing PPPP contacts
        env:
          BITRIX_HOST: b24-cl53os.bitrix24.com
          BITRIX_LOGIN: sales@prissteel.com
          BITRIX_APP_PASSWORD: ${{ secrets.BITRIX_APP_PASSWORD }}
          PPPP_SYNC_EMAIL: ${{ secrets.PPPP_SYNC_EMAIL }}
          PPPP_SYNC_PASSWORD: ${{ secrets.PPPP_SYNC_PASSWORD }}
          UPDATE_MODE: ${{ inputs.mode }}
        run: node scripts/bitrix-pppp-fill-existing.mjs

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitrix-pppp-fill-existing
          path: tmp/bitrix-pppp-fill-existing.json
          if-no-files-found: ignore
          retention-days: 3
