name: Deploy PRISTEEL Preview (manual fallback)

# The tested Workspace V2 Safe Check workflow is now the only automatic
# preview deployment path. Keeping this file as a manual fallback avoids
# two concurrent jobs racing to publish different preview artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Explain fallback
        run: echo 'Automatic preview deployment is handled by workspace-v2-safe-check.yml after the full test suite passes.'
