name: Deploy PRISTEEL Preview

on:
  push:
    branches:
      - workspace-v2-safe-build
    paths-ignore:
      - 'DEPLOYMENT_STATUS.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pristeel-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe preview branch
        uses: actions/checkout@v4

      - name: Build static preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude 'scripts/' \
            --exclude 'package-lock.json' \
            --exclude 'package.json' \
            --exclude 'preview-server.mjs' \
            --exclude '.stackblitzrc' \
            --exclude 'DEPLOYMENT_STATUS.md'
          cp pristeel-procurement.html _site/index.html
          python - <<'PY'
          from pathlib import Path
          path = Path('_site/index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<head>'
          script = '<head>\n<script src="pristeel-stable-boot-v2.js?v=20260805-1"></script>'
          if marker not in html:
              raise SystemExit('Missing <head> in platform HTML')
          path.write_text(html.replace(marker, script, 1), encoding='utf-8')
          PY
          grep -q 'pristeel-stable-boot-v2.js' _site/index.html
          test -s _site/pristeel-stable-boot-v2.js
          test -s _site/pristeel-business-command-center-v1.js
          test -s _site/pristeel-gmail-deep-search-v1.js
          test -s _site/pristeel-business-command-center-deep-gmail-v1.js
          test -s _site/pristeel-project-command-view-v1.js
          test -s _site/pristeel-home-command-center-v2.js
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: pristeel-preview-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed platform
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -L -sS -o /tmp/pristeel.html -w '%{http_code}' "$PAGE_URL" || true)
            boot_code=$(curl -L -sS -o /tmp/pristeel-boot.js -w '%{http_code}' "${PAGE_URL%/}/pristeel-stable-boot-v2.js?v=20260805-1" || true)
            bcc_code=$(curl -L -sS -o /tmp/pristeel-bcc.js -w '%{http_code}' "${PAGE_URL%/}/pristeel-business-command-center-v1.js?v=20260806-2" || true)
            deep_code=$(curl -L -sS -o /tmp/pristeel-deep.js -w '%{http_code}' "${PAGE_URL%/}/pristeel-gmail-deep-search-v1.js?v=20260806-1" || true)
            project_code=$(curl -L -sS -o /tmp/pristeel-project-command.js -w '%{http_code}' "${PAGE_URL%/}/pristeel-project-command-view-v1.js?v=20260806-1" || true)
            home_code=$(curl -L -sS -o /tmp/pristeel-home-command.js -w '%{http_code}' "${PAGE_URL%/}/pristeel-home-command-center-v2.js?v=20260806-1" || true)
            if [ "$code" = "200" ] && [ "$boot_code" = "200" ] && [ "$bcc_code" = "200" ] && [ "$deep_code" = "200" ] && [ "$project_code" = "200" ] && [ "$home_code" = "200" ] \
              && grep -q 'pristeel-stable-boot-v2.js' /tmp/pristeel.html \
              && grep -q '__pstStableBootV2' /tmp/pristeel-boot.js \
              && grep -q '__pstBusinessCommandCenterV1' /tmp/pristeel-bcc.js \
              && grep -q '__pstGmailDeepSearchV1' /tmp/pristeel-deep.js \
              && grep -q '__pstProjectCommandViewV1' /tmp/pristeel-project-command.js \
              && grep -q '__pstHomeCommandCenterV2' /tmp/pristeel-home-command.js \
              && ! grep -Eq 'new[[:space:]]+MutationObserver|setInterval[[:space:]]*\(' /tmp/pristeel-boot.js \
              && ! grep -q 'pristeel-startup-guard-v2.js' /tmp/pristeel.html \
              && ! grep -q 'pristeel-login-transition' /tmp/pristeel.html \
              && ! grep -q 'pristeel-simple-boot-v1.js' /tmp/pristeel.html; then
              echo "Verified stable startup, deep Gmail search and command-center redesign at $PAGE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not become reachable with the full command-center redesign in time."
          exit 1

  report:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    steps:
      - name: Record deployment result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git clone --branch workspace-v2-safe-build --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-repo
          cd status-repo
          status="FAILED"
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            status="VERIFIED"
          fi
          cat > DEPLOYMENT_STATUS.md <<EOF
          # PRISTEEL direct preview

          Status: ${status}

          Build: ${BUILD_RESULT}

          Deploy: ${DEPLOY_RESULT}

          Run ID: ${RUN_ID}

          URL: ${PAGE_URL:-https://lemonstudiosks-collab.github.io/pristeel-app/}

          Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEPLOYMENT_STATUS.md
          git commit -m 'Record PRISTEEL preview deployment status' || exit 0
          git push origin workspace-v2-safe-build
