name: Bitrix24 to PPPP import new contacts

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Import only contacts that do not already exist in PPPP by email
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  import-new:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import new Bitrix24 contacts into PPPP
        env:
          BITRIX_HOST: b24-cl53os.bitrix24.com
          BITRIX_LOGIN: sales@prissteel.com
          BITRIX_APP_PASSWORD: ${{ secrets.BITRIX_APP_PASSWORD }}
          PPPP_SYNC_EMAIL: ${{ secrets.PPPP_SYNC_EMAIL }}
          PPPP_SYNC_PASSWORD: ${{ secrets.PPPP_SYNC_PASSWORD }}
          APPLY_NEW_CONTACTS: ${{ inputs.apply }}
        run: node scripts/bitrix-pppp-import-new.mjs

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitrix-pppp-import-new
          path: tmp/bitrix-pppp-import-new.json
          if-no-files-found: ignore
          retention-days: 3
