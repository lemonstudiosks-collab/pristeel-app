name: Project Data Reconcile

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/project-data-reconcile.mjs'
      - 'scripts/project-email-reconcile.mjs'
      - 'scripts/project-discovery-queue.mjs'
      - 'tests/project-data-reconcile-smoke.mjs'
      - 'tests/project-email-reconcile-smoke.mjs'
      - 'tests/project-discovery-queue-smoke.mjs'
      - 'pristeel-project-discovery.js'
      - 'pristeel-gmail-project-identity-guard-v1.js'
      - '.github/workflows/project-data-reconcile.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only or apply deterministic repairs'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
      confirm_apply:
        description: 'Required confirmation when mode=apply'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit manual apply confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirm_apply != true }}
        run: |
          echo 'Manual apply mode requires confirm_apply=true.'
          exit 1
      - name: Test reconciliation planner
        run: node tests/project-data-reconcile-smoke.mjs
      - name: Test project email reconciliation safety
        run: node tests/project-email-reconcile-smoke.mjs
      - name: Test Project Discovery queue safety
        run: node tests/project-discovery-queue-smoke.mjs
      - name: Reconcile project data
        env:
          SUPABASE_URL: https://isymxqfqzkchbsrbhucf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'preview' }}
        run: node scripts/project-data-reconcile.mjs
      - name: Reconcile project emails
        env:
          SUPABASE_URL: https://isymxqfqzkchbsrbhucf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_RECONCILE_MODE: ${{ github.event_name == 'schedule' && 'apply' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'preview') }}
        run: node scripts/project-email-reconcile.mjs
      - name: Preview Project Discovery queue
        env:
          SUPABASE_URL: https://isymxqfqzkchbsrbhucf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_DISCOVERY_MODE: preview
        run: node scripts/project-discovery-queue.mjs
      - name: Upload reconciliation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-data-reconcile-${{ github.event_name }}-${{ github.run_number }}
          path: |
            tmp/project-data-reconcile.json
            tmp/project-email-reconcile.json
            tmp/project-discovery-queue.json
          retention-days: 14
