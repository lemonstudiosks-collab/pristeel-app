name: Project Data Reconcile

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only or apply deterministic repairs'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
      confirm_apply:
        description: 'Required confirmation when mode=apply'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit apply confirmation
        if: ${{ inputs.mode == 'apply' && inputs.confirm_apply != true }}
        run: |
          echo 'Apply mode requires confirm_apply=true.'
          exit 1
      - name: Test reconciliation planner
        run: node tests/project-data-reconcile-smoke.mjs
      - name: Test project email reconciliation safety
        run: node tests/project-email-reconcile-smoke.mjs
      - name: Reconcile project data
        env:
          SUPABASE_URL: https://isymxqfqzkchbsrbhucf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MODE: ${{ inputs.mode }}
        run: node scripts/project-data-reconcile.mjs
      - name: Reconcile project emails
        env:
          SUPABASE_URL: https://isymxqfqzkchbsrbhucf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_RECONCILE_MODE: ${{ inputs.mode }}
        run: node scripts/project-email-reconcile.mjs
      - name: Upload reconciliation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-data-reconcile-${{ inputs.mode }}
          path: |
            tmp/project-data-reconcile.json
            tmp/project-email-reconcile.json
          retention-days: 14
