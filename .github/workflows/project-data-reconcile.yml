name: Project Data Reconcile (Dry Run Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace-v2-safe-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect project records without writing
        env:
          SUPABASE_URL: https://isymxqfqzkchbsrbhucf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: 'false'
        run: node scripts/project-data-reconcile.mjs | tee project-reconcile-report.json
      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-reconcile-dry-run
          path: project-reconcile-report.json
          retention-days: 7
