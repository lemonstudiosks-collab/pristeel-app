name: Opportunities Projects Contacts UX smoke

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check changed UI syntax
        run: |
          node --check pristeel-project-centric-workflow-v1.js
          node --check pristeel-ted-sales-surface-v1.js
          node --check pristeel-tender-dossier-analysis-v1.js
          node --check pristeel-project-classification-v1.js
          node --check pristeel-contact-master-v1.js
          node --check pristeel-opportunities-filter-polish-v1.js
          node --check pristeel-opportunities-waiting-bridge-v1.js
          node --check pristeel-global-fullwidth-shell-v1.js
          node --check pristeel-finance-mindmap-v1.js
          node --check pristeel-production-surface-owner-v1.js
      - name: Verify dossier-first Albanian UX contract
        run: node tests/opportunities-projects-contacts-ux-smoke.mjs
      - name: Verify sent-email lifecycle presentation
        run: node tests/opportunities-lifecycle-sent-smoke.mjs
      - name: Verify waiting lifecycle and Opportunities mindmap layout
        run: node tests/opportunities-waiting-layout-smoke.mjs
      - name: Verify safe outreach registry read migration
        run: node tests/opportunities-waiting-registry-migration-smoke.mjs
      - name: Reproduce visible Opportunities, global shell, and Finance controls
        run: |
          npm install --ignore-scripts --no-package-lock
          node tests/opportunities-visible-runtime-smoke.mjs
          node tests/opportunities-mindmap-v5-interaction-smoke.mjs
          node tests/global-fullwidth-shell-smoke.mjs
          node tests/finance-mindmap-interaction-smoke.mjs
          node tests/production-surface-owner-smoke.mjs
          node tests/runtime-ownership-multi-cycle-smoke.mjs
