name: Multilateral final runtime guard

on:
  push:
    branches:
      - feat/tender-sources-multilateral-20260912
    paths:
      - .github/workflows/multilateral-finalize-runtime.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tender-sources-multilateral-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile bootstrap source of truth
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const registryPath='runtime-bootstrap-order.json';
          const sequencePath='scripts/bootstrap-sequence-check.mjs';
          const liveHomeTestPath='tests/live-home-command-grid-loader-smoke.js';
          const nativeTestPath='tests/native-ui-v3-smoke.js';
          const oldEntry='pristeel-redesign-finalizer-v1.js?v=20260906-krppzip1';
          const newEntry='pristeel-redesign-finalizer-v1.js?v=20260912-multisource1';
          const oldBootstrapSha='33923c761378c233afd003b23a7aaf5a20daeabd';
          const registry=JSON.parse(fs.readFileSync(registryPath,'utf8'));
          const hits=registry.files.filter(x=>x===oldEntry).length;
          if(hits!==1) throw new Error(`guard: expected one old finalizer entry, got ${hits}`);
          registry.files=registry.files.map(x=>x===oldEntry?newEntry:x);
          const digest=crypto.createHash('sha256').update(`${registry.files.join('\n')}\n`,'utf8').digest('hex');
          registry.sequenceSha256=digest;
          fs.writeFileSync(registryPath,JSON.stringify(registry,null,2)+'\n');

          let liveHome=fs.readFileSync(liveHomeTestPath,'utf8');
          if(!liveHome.includes(oldEntry)) throw new Error('guard: live-home cache-key baseline changed');
          liveHome=liveHome.replace(oldEntry,newEntry);
          fs.writeFileSync(liveHomeTestPath,liveHome);

          let seq=fs.readFileSync(sequencePath,'utf8');
          if(!/const EXPECTED_DIGEST = '[0-9a-f]{64}';/.test(seq)) throw new Error('guard: sequence baseline missing');
          seq=seq.replace(/const EXPECTED_DIGEST = '[0-9a-f]{64}';/,`const EXPECTED_DIGEST = '${digest}';`);
          fs.writeFileSync(sequencePath,seq);

          const render=files=>`/* PRISTEEL email modules bootstrap */\n(function(){\n'use strict';\nvar files=[\n${files.map((file,index)=>`  '${file}'${index===files.length-1?'':','}`).join('\n')}\n];\nvar completed=false,timeoutMs=8000,maxAttempts=2;\nvar diag=window.__pstBootstrapDiagnostics=window.__pstBootstrapDiagnostics||{started_at:new Date().toISOString(),total:files.length,loaded:0,errors:[],timeouts:[],retries:[],completed:false};\nfunction ready(){if(completed)return;completed=true;diag.completed=true;diag.completed_at=new Date().toISOString();window.__pstModulesReady=true;try{document.dispatchEvent(new CustomEvent('pst:modules-ready'));}catch(e){}}\nfunction next(i){if(window.__pstAbortBootstrap){ready();return;}load(i+1,1);}\nfunction load(i,attempt){\n if(i>=files.length){ready();return;}\n if(window.__pstAbortBootstrap){ready();return;}\n attempt=attempt||1;\n var base=files[i],src=base;\n if(base.indexOf('pristeel-project-open-direct-v1.js?')===0)src=base+'&pst_hotfix=20260830-navrepair2';\n if(attempt>1)src=src+(src.indexOf('?')>-1?'&':'?')+'pst_retry='+Date.now();\n var el=document.createElement('script'),settled=false,timer=null;\n el.src=src;el.defer=true;el.setAttribute('data-pst-bootstrap-index',String(i));el.setAttribute('data-pst-bootstrap-attempt',String(attempt));\n function finish(kind,error){\n  if(settled)return;settled=true;if(timer)clearTimeout(timer);el.onload=null;el.onerror=null;\n  if(kind==='load'){diag.loaded++;next(i);return;}\n  try{el.remove();}catch(e){}\n  var row={index:i,module:base,attempt:attempt,at:new Date().toISOString(),error:error?String(error):null};\n  if(kind==='timeout')diag.timeouts.push(row);else diag.errors.push(row);\n  if(attempt<maxAttempts){diag.retries.push({index:i,module:base,attempt:attempt+1,reason:kind,at:new Date().toISOString()});load(i,attempt+1);return;}\n  console.error('Nuk u ngarkua moduli pas '+maxAttempts+' tentimeve:',base,kind,error||'');next(i);\n }\n el.onload=function(){finish('load');};\n el.onerror=function(e){finish('error',e&&e.message||'script error');};\n timer=setTimeout(function(){finish('timeout','>'+timeoutMs+'ms');},timeoutMs);\n document.head.appendChild(el);\n}\nload(0,1);\n})();`;
          const generated=render(registry.files);
          const body=Buffer.from(generated,'utf8');
          const bootstrapSha=crypto.createHash('sha1').update(Buffer.from(`blob ${body.length}\0`,'utf8')).update(body).digest('hex');
          let nativeTest=fs.readFileSync(nativeTestPath,'utf8');
          const oldNeedle=`manifest.entrypoints.bootstrapGitBlobSha==='${oldBootstrapSha}'`;
          if(!nativeTest.includes(oldNeedle)) throw new Error('guard: native UI bootstrap SHA baseline changed');
          nativeTest=nativeTest.replace(oldNeedle,`manifest.entrypoints.bootstrapGitBlobSha==='${bootstrapSha}'`);
          fs.writeFileSync(nativeTestPath,nativeTest);
          console.log(`registry digest=${digest}; expected bootstrap blob=${bootstrapSha}`);
          NODE
          node scripts/generate-bootstrap.mjs
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const bootstrap='pristeel-project-emails.js';
          const text=fs.readFileSync(bootstrap,'utf8');
          const body=Buffer.from(text,'utf8');
          const blob=crypto.createHash('sha1').update(Buffer.from(`blob ${body.length}\0`,'utf8')).update(body).digest('hex');
          const manifest=JSON.parse(fs.readFileSync('runtime-manifest.json','utf8'));
          if(manifest.entrypoints.bootstrap!==bootstrap) throw new Error('guard: bootstrap owner changed');
          manifest.entrypoints.bootstrapGitBlobSha=blob;
          fs.writeFileSync('runtime-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(`bootstrap blob=${blob}`);
          NODE
      - name: Verify canonical runtime and tests
        run: |
          node scripts/generate-bootstrap.mjs --check
          node scripts/runtime-manifest-check.mjs
          node scripts/bootstrap-sequence-check.mjs
          node tests/live-home-command-grid-loader-smoke.js
          node tests/native-ui-v3-smoke.js
          node tests/redesign-finalizer-smoke.js
      - name: Commit canonical runtime reconciliation
        shell: bash
        run: |
          if git diff --quiet -- runtime-bootstrap-order.json pristeel-project-emails.js runtime-manifest.json scripts/bootstrap-sequence-check.mjs tests/live-home-command-grid-loader-smoke.js tests/native-ui-v3-smoke.js; then
            echo 'No runtime reconciliation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime-bootstrap-order.json pristeel-project-emails.js runtime-manifest.json scripts/bootstrap-sequence-check.mjs tests/live-home-command-grid-loader-smoke.js tests/native-ui-v3-smoke.js
          git commit -m 'Reconcile multilateral runtime source of truth'
          git push origin HEAD:feat/tender-sources-multilateral-20260912