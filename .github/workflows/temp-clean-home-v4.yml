name: TEMP normalize isolated Home v4 source
on:
  push:
    branches:
      - home-ops-create-structural-20260908
    paths:
      - tools/home-v4-normalize-trigger
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace duplicated Home data/render region with canonical four-zone implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pristeel-native-ui-v4-core.js')
          text=p.read_text(encoding='utf-8')
          start=text.index('function loadHome(force){')
          end=text.index('function refreshHome(force){',start)
          clean=r'''function loadHome(force){if(state.busy)return Promise.resolve(state.data);if(!force&&state.data&&Date.now()-state.loadedAt<60000)return Promise.resolve(state.data);if(typeof window.supaFetch!=='function')return Promise.resolve(null);state.busy=true;return Promise.all([db('projects?select=id,name,client,status,pipeline_stage,operational_state,last_activity_at,last_email_at,updated_at&order=last_activity_at.desc.nullslast&limit=500'),db('pppp_home_current_actions_v1?select=id,project_id,project_name,client,title,detail,due_date,priority,status,source,created_at&order=created_at.desc&limit=100'),db('invoices_out?select=id,invoice_nr,client,date,due_date,gross_amount,total_price,amount,paid,paid_date,project,project_id&order=date.desc&limit=1000'),db('invoices_in?select=id,supplier_invoice_nr,supplier,date,due_date,amount,gross_amount,total_price,paid,paid_date,project,project_id&order=date.desc&limit=1000'),db('pppp_tender_operating_lanes_v1?select=id,title,operating_lane,status,project_id,deadline&order=deadline.asc.nullslast&limit=500'),db('outreach_contacts?select=id,status,follow_up_date,closed,replied,meeting,updated_at&order=updated_at.desc&limit=1000'),db('rpc/pppp_automation_health_v1','POST',{})]).then(function(o){state.data={projects:A(o[0]),actions:A(o[1]),out:A(o[2]),inn:A(o[3]),opp:A(o[4]),outreach:A(o[5]),automation:(Array.isArray(o[6])&&o[6][0]&&o[6][0].pppp_automation_health_v1)||o[6]||{}};state.loadedAt=Date.now();return state.data;}).catch(function(){return state.data||null;}).finally(function(){state.busy=false;});}
function renderHome(d){
 var r=renderShell();if(!r||!d)return false;
 var projects=d.projects.filter(projectActive),groups=groupActions(d.actions),sg={execution:0,action:0,waiting:0,other:0};projects.forEach(function(p){sg[statusGroup(p)]++;});
 var outOver=d.out.filter(function(x){return !paid(x)&&duePast(x.due_date);}),inOver=d.inn.filter(function(x){return !paid(x)&&duePast(x.due_date);}),outSoon=d.out.filter(function(x){return !paid(x)&&dueSoon(x.due_date);}),inSoon=d.inn.filter(function(x){return !paid(x)&&dueSoon(x.due_date);});
 var openOpp=d.opp.filter(function(x){return !x.project_id&&!/closed|rejected|no go/.test(N(x.status));}),tenderSoon=d.opp.filter(function(x){return !x.project_id&&dueSoon(x.deadline);});
 var followDue=d.outreach.filter(function(x){return !x.closed&&x.follow_up_date&&duePast(x.follow_up_date);}),followSoon=d.outreach.filter(function(x){return !x.closed&&x.follow_up_date&&dueSoon(x.follow_up_date);});
 var waitingProjects=projects.filter(function(p){return statusGroup(p)==='waiting';}),overdueActions=d.actions.filter(function(a){return a&&a.due_date&&duePast(a.due_date);}),blockers=d.actions.filter(function(a){return /blocker|blocked|bllok|bllokuar/.test(N(S(a.title)+' '+S(a.detail)+' '+S(a.status)));});
 var ah=d.automation||{},issues=Number(ah.issue_count||ah.issues||0);if(!issues)issues=Number(ah.ocr_pending||0)+Number(ah.semantic_pending||0)+Number(ah.drive_missing_count||0);
 var grid=r.querySelector('#pn-work-grid');grid.innerHTML='<article class="pn-panel pn-panel-primary"><header><div><span>PËR TY TANI</span><h2>Veprimet që kërkojnë ty</h2><p>Hapi tjetër, arsyeja dhe afati — të lidhura me projektin real.</p></div><button data-pn-area="projects">Shiko projektet →</button></header><div class="pn-work-list" id="pn-actions"></div></article><article class="pn-panel pn-panel-next"><header><div><span>NË VIJIM</span><h2>Afate, pritje dhe rikujtime</h2><p>Gjërat që po afrohen ose që duhen ndjekur, pa karta të dyfishta.</p></div></header><div class="pn-work-list" id="pn-next"></div></article>';
 grid.querySelector('#pn-actions').innerHTML=groups.length?groups.slice(0,6).map(priorityRow).join(''):'<div class="pn-clear"><i>✓</i><span>Nuk ka veprime të konfirmuara që kërkojnë vëmendjen tënde tani.</span></div>';
 var next=[];if(tenderSoon.length)next.push(signalRow('target','warn','opportunities','due','Mundësitë','Tenderë me afat brenda shtatë ditësh',tenderSoon.length));if(followSoon.length)next.push(signalRow('clock','warn','outreach','due','Rikujtime','Ndjekje komerciale brenda shtatë ditësh',followSoon.length));if(waitingProjects.length)next.push(signalRow('waiting','','projects','waiting','Pritje','Projekte që presin klientin ose furnitorin',waitingProjects.length));
 var outSoonSum=outSoon.reduce(function(a,x){return a+Number(x.gross_amount||x.total_price||x.amount||0);},0),inSoonSum=inSoon.reduce(function(a,x){return a+Number(x.amount||x.gross_amount||x.total_price||0);},0);if(outSoon.length)next.push(signalRow('finance','warn','finance','due','Financat','Arkëtime që afrohen',money(outSoonSum)));if(inSoon.length)next.push(signalRow('finance','warn','finance','unpaid','Financat','Pagesa furnitorësh që afrohen',money(inSoonSum)));grid.querySelector('#pn-next').innerHTML=next.length?next.join(''):'<div class="pn-clear"><i>✓</i><span>Nuk ka afate, pritje ose rikujtime që kërkojnë vëmendje në shtatë ditët e ardhshme.</span></div>';
 var pulse=r.querySelector('#pn-portfolio-pulse');pulse.innerHTML=pulseItem('project','','projects','','Projekte aktive','Portofoli aktual',projects.length)+pulseItem('target',openOpp.length?'warn':'','opportunities','','Mundësi të hapura','Puna para projektit',openOpp.length)+pulseItem('execution','','projects','execution','Në realizim','Puna në ekzekutim',sg.execution)+pulseItem('waiting',sg.waiting?'warn':'','projects','waiting','Në pritje','Klient ose furnitor',sg.waiting);
 var exceptions=[];if(blockers.length)exceptions.push(exceptionItem('warning','danger','projects','action','Bllokues',blockers.length));if(overdueActions.length)exceptions.push(exceptionItem('clock','danger','projects','action','Veprime me afat të kaluar',overdueActions.length));if(outOver.length)exceptions.push(exceptionItem('finance','danger','finance','overdue','Arkëtime të vonuara',outOver.length));if(inOver.length)exceptions.push(exceptionItem('finance','danger','finance','unpaid','Pagesa furnitorësh të vonuara',inOver.length));if(followDue.length)exceptions.push(exceptionItem('clock','warn','outreach','due','Rikujtime të kaluara',followDue.length));if(issues>0)exceptions.push(exceptionItem('warning','danger','system','','Probleme automatizimi',issues));
 var ex=r.querySelector('#pn-exceptions');if(exceptions.length){ex.hidden=false;ex.innerHTML='<span class="pn-ex-label">KËRKON VËMENDJE</span>'+exceptions.join('');}else{ex.hidden=true;ex.innerHTML='';}
 adoptAsk();claimHome();normalizeAlbanian();return true;
}
'''
          p.write_text(text[:start]+clean+text[end:],encoding='utf-8')
          PY
      - name: Verify normalized source contract
        run: |
          set -euo pipefail
          node --check pristeel-native-ui-v4-core.js
          test "$(grep -c '^function loadHome(force)' pristeel-native-ui-v4-core.js)" -eq 1
          test "$(grep -c '^function renderHome(d)' pristeel-native-ui-v4-core.js)" -eq 1
          ! grep -q 'pn-kpis' pristeel-native-ui-v4-core.js
          ! grep -q 'pn-clients-movement' pristeel-native-ui-v4-core.js
          ! grep -q 'pn-projects-commercial' pristeel-native-ui-v4-core.js
          grep -q 'PËR TY TANI' pristeel-native-ui-v4-core.js
          grep -q 'NË VIJIM' pristeel-native-ui-v4-core.js
          grep -q 'pn-portfolio-pulse' pristeel-native-ui-v4-core.js
          grep -q 'KËRKON VËMENDJE' pristeel-native-ui-v4-core.js
      - name: Commit normalized source and remove temporary scaffolding
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pristeel-native-ui-v4-core.js
          git rm -f .github/workflows/temp-clean-home-v4.yml tools/home-v4-normalize-trigger
          git commit -m "Normalize canonical four-zone Home renderer"
          git push
