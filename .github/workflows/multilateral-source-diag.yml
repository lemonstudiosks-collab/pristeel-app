name: Multilateral source diagnostics

on:
  push:
    branches:
      - feat/tender-sources-multilateral-20260912
    paths:
      - .github/workflows/multilateral-source-diag.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect canonical EEAS Kosovo tender search
        run: |
          node <<'NODE'
          const UA='PriSteel-PPPP-Procurement-Monitor/1.0 (+https://prissteel.com)';
          const urls=[
            'https://www.eeas.europa.eu/search_en?f%5B0%5D=owner%3A321&f%5B1%5D=ct%3Atender',
            'https://www.eeas.europa.eu/eeas/tenders_en?s=113'
          ];
          const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
          for(const url of urls){
            const r=await fetch(url,{redirect:'follow',headers:{'User-Agent':UA,Accept:'text/html,application/xhtml+xml,*/*;q=0.8',Referer:'https://www.eeas.europa.eu/'}});
            const h=await r.text();
            const hrefs=[...h.matchAll(/href\s*=\s*["']([^"']+)["']/gi)].map(m=>m[1]);
            const kos=[...new Set(hrefs.filter(x=>/kosovo/i.test(x)))];
            const delegation=[...new Set(hrefs.filter(x=>/delegations\/kosovo/i.test(x)))];
            const known='Strengthening Information Integrity';
            const idx=h.toLowerCase().indexOf(known.toLowerCase());
            console.log(`URL=${url} status=${r.status} final=${r.url} bytes=${h.length} hrefs=${hrefs.length} kosovoHrefs=${kos.length} delegationKosovo=${delegation.length}`);
            console.log(`KOSOVO_HREFS=${JSON.stringify(kos.slice(0,30))}`);
            console.log(`KNOWN_TITLE_FOUND=${idx>=0}`);
            if(idx>=0)console.log(`KNOWN_CONTEXT=${JSON.stringify(clean(h.slice(Math.max(0,idx-1800),idx+3000)).slice(0,4700))}`);
            const tenderMarkers=(h.match(/\bTENDER\b/gi)||[]).length;
            console.log(`TENDER_MARKERS=${tenderMarkers}`);
          }
          NODE