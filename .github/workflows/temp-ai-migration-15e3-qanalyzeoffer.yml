name: TEMP Cleanup 15E3 qAnalyzeOffer migration

on:
  push:
    branches:
      - cleanup/ai-inline-qanalyzeoffer-20260814
    paths:
      - scripts/apply-ai-migration-15e3-qanalyzeoffer.mjs
      - .github/workflows/temp-ai-migration-15e3-qanalyzeoffer.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ai-inline-qanalyzeoffer-20260814
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply qAnalyzeOffer migration
        run: node scripts/apply-ai-migration-15e3-qanalyzeoffer.mjs
      - name: Validate isolated migration
        run: |
          node scripts/q-analyze-offer-ai-smoke.mjs
          node scripts/runtime-manifest-check.mjs
          node scripts/bootstrap-sequence-check.mjs
          node scripts/generate-bootstrap.mjs --check
          git diff --check
      - name: Commit runtime migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pristeel-procurement.html runtime-manifest.json
          if git diff --cached --quiet; then
            echo "No runtime migration produced." >&2
            exit 1
          fi
          git commit -m "Migrate qAnalyzeOffer to explicit AI request API"
          git push origin HEAD:cleanup/ai-inline-qanalyzeoffer-20260814
