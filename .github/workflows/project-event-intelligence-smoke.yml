name: Project email event intelligence smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/pppp-project-event-intelligence/**'
      - 'tests/project-event-intelligence-fallback-smoke.mjs'
      - '.github/workflows/project-event-intelligence-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/pppp-project-event-intelligence/**'
      - 'tests/project-event-intelligence-fallback-smoke.mjs'
      - '.github/workflows/project-event-intelligence-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test STACON event rules
        run: node tests/project-event-intelligence-fallback-smoke.mjs
      - name: Type-check Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/pppp-project-event-intelligence/index.ts
