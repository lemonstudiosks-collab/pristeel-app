name: Multilateral cache-bust guarded patch

on:
  push:
    branches:
      - feat/tender-sources-multilateral-20260912
    paths:
      - .github/workflows/multilateral-cache-bust-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tender-sources-multilateral-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded cache-bust patch
        run: node scripts/apply-multilateral-cache-bust.mjs
      - name: Verify runtime guards and source UI
        run: |
          node --check pristeel-redesign-finalizer-v1.js
          node --check pristeel-project-emails.js
          node scripts/runtime-manifest-check.mjs
          node scripts/bootstrap-sequence-check.mjs
          node tests/multilateral-opportunities-source-smoke.js
          node --check scripts/multilateral-procurement-core.mjs
          node --check scripts/multilateral-procurement-sync.mjs
      - name: Commit cache-bust patch
        shell: bash
        run: |
          if git diff --quiet -- pristeel-redesign-finalizer-v1.js pristeel-project-emails.js runtime-manifest.json scripts/bootstrap-sequence-check.mjs; then
            echo 'No cache-bust changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pristeel-redesign-finalizer-v1.js pristeel-project-emails.js runtime-manifest.json scripts/bootstrap-sequence-check.mjs
          git commit -m 'Bust Opportunities runtime cache for multilateral sources'
          git push origin HEAD:feat/tender-sources-multilateral-20260912
