name: Daily zones cleanup smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  daily-zones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check pristeel-daily-zones-cleanup-v1.js
      - run: node tests/daily-zones-cleanup-smoke.js
