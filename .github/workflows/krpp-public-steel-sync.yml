name: KRPP public PRISTEEL monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        default: preview
        type: choice
        options: [preview, apply]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/krpp-public-steel-sync.mjs'
      - 'scripts/krpp-public-steel-runner.mjs'
      - 'scripts/krpp-public-capability-runner.mjs'
      - 'scripts/pristeel-capability-profile.mjs'
      - 'tests/krpp-public-steel-sync-smoke.mjs'
      - 'tests/public-steel-boundary-regression.mjs'
      - 'tests/pristeel-capability-profile-smoke.mjs'
      - '.github/workflows/krpp-public-steel-sync.yml'
  schedule:
    - cron: '27 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/krpp-public-steel-sync.mjs'
      - 'scripts/krpp-public-steel-runner.mjs'
      - 'scripts/krpp-public-capability-runner.mjs'
      - 'scripts/pristeel-capability-profile.mjs'
      - '.github/workflows/krpp-public-steel-sync.yml'

permissions:
  contents: read

concurrency:
  group: krpp-public-steel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://isymxqfqzkchbsrbhucf.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      PPPP_SYNC_EMAIL: ${{ secrets.PPPP_SYNC_EMAIL }}
      PPPP_SYNC_PASSWORD: ${{ secrets.PPPP_SYNC_PASSWORD }}
      KRPP_PUBLIC_MIN_SCORE: '35'
      KRPP_PUBLIC_MAX_CANDIDATES: '240'
      SYNC_MODE: ${{ github.event_name == 'pull_request' && 'preview' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'apply') }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check collector syntax
        run: |
          node --check scripts/krpp-public-steel-sync.mjs
          node --check scripts/krpp-public-steel-runner.mjs
          node --check scripts/pristeel-capability-profile.mjs
          node --check scripts/krpp-public-capability-runner.mjs
      - name: Run parser and classifier smoke tests
        run: |
          node tests/krpp-public-steel-sync-smoke.mjs
          node tests/public-steel-boundary-regression.mjs
          node tests/pristeel-capability-profile-smoke.mjs
      - name: Collect public KRPP PRISTEEL opportunities
        run: node scripts/krpp-public-capability-runner.mjs
      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krpp-public-pristeel-monitor
          path: tmp/krpp-public-steel-sync.json
          if-no-files-found: ignore
          retention-days: 14
