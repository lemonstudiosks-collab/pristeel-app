name: PRISTEEL Manual Safe Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pristeel-manual-safe-preview
  cancel-in-progress: true

jobs:
  test_build_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pristeel-preview-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current safe branch
        uses: actions/checkout@v4
        with:
          ref: workspace-v2-safe-build
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete workspace checks
        run: npm test
      - name: Build tested redesign
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          rsync -a ./ _site/ --exclude '.git/' --exclude '.github/' --exclude '_site/' --exclude 'node_modules/' --exclude 'tests/' --exclude 'scripts/' --exclude 'package-lock.json' --exclude 'package.json' --exclude 'preview-server.mjs' --exclude '.stackblitzrc' --exclude 'DEPLOYMENT_STATUS.md' --exclude 'PREVIEW_*_TRIGGER_20260807.txt'
          cp pristeel-procurement.html _site/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          h=p.read_text(encoding='utf-8')
          if '<head>' not in h or '</body>' not in h:
              raise SystemExit('Platform HTML structure is incomplete')
          h=h.replace('<head>','<head>\n<script src="pristeel-stable-boot-v2.js?v=20260805-1"></script>',1)
          h=h.replace('src="pristeel-project-emails.js"','src="pristeel-project-emails.js?v=20260807-12"')
          h=h.replace("src='pristeel-project-emails.js'","src='pristeel-project-emails.js?v=20260807-12'")
          tail='''
<!-- PRISTEEL tested redesign revision 20260807-12 -->
<script src="pristeel-dashboard-task-cards-v1.js?v=20260807-12"></script>
<script src="pristeel-business-command-center-v1.js?v=20260807-12"></script>
<script src="pristeel-gmail-deep-search-v1.js?v=20260807-12"></script>
<script src="pristeel-business-command-center-deep-gmail-v1.js?v=20260807-12"></script>
<script src="pristeel-project-command-view-v1.js?v=20260807-12"></script>
<script src="pristeel-home-command-center-v2.js?v=20260807-12"></script>
<script src="pristeel-redesign-finalizer-v1.js?v=20260807-12"></script>
'''
          h=h.replace('</body>',tail+'\n</body>',1)
          p.write_text(h,encoding='utf-8')
          PY
          grep -q 'pristeel-project-emails.js?v=20260807-12' _site/index.html
          grep -q 'pristeel-redesign-finalizer-v1.js?v=20260807-12' _site/index.html
          for f in pristeel-dashboard-task-cards-v1.js pristeel-business-command-center-v1.js pristeel-gmail-deep-search-v1.js pristeel-business-command-center-deep-gmail-v1.js pristeel-project-command-view-v1.js pristeel-home-command-center-v2.js pristeel-redesign-finalizer-v1.js; do test -s "_site/$f"; done
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live redesign
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            curl -L -sS "$PAGE_URL" -o /tmp/index.html || true
            curl -L -sS "${PAGE_URL%/}/pristeel-business-command-center-v1.js?v=20260807-12" -o /tmp/bcc.js || true
            curl -L -sS "${PAGE_URL%/}/pristeel-gmail-deep-search-v1.js?v=20260807-12" -o /tmp/deep.js || true
            curl -L -sS "${PAGE_URL%/}/pristeel-project-command-view-v1.js?v=20260807-12" -o /tmp/pcv.js || true
            curl -L -sS "${PAGE_URL%/}/pristeel-home-command-center-v2.js?v=20260807-12" -o /tmp/home.js || true
            curl -L -sS "${PAGE_URL%/}/pristeel-redesign-finalizer-v1.js?v=20260807-12" -o /tmp/finalizer.js || true
            if grep -q 'pristeel-project-emails.js?v=20260807-12' /tmp/index.html \
              && grep -q 'pristeel-redesign-finalizer-v1.js?v=20260807-12' /tmp/index.html \
              && grep -q '__pstBusinessCommandCenterV1' /tmp/bcc.js \
              && grep -q '__pstGmailDeepSearchV1' /tmp/deep.js \
              && grep -q '__pstProjectCommandViewV1' /tmp/pcv.js \
              && grep -q '__pstHomeCommandCenterV2' /tmp/home.js \
              && grep -q '__pstRedesignFinalizerV1' /tmp/finalizer.js; then
              echo "PRISTEEL redesign 20260807-12 verified live at $PAGE_URL"
              exit 0
            fi
            sleep 10
          done
          exit 1
