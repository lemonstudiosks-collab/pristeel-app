name: Bitrix24 to PPPP safe contact sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/bitrix-pppp-sync.mjs'
      - 'scripts/bitrix-contact-email-resolver.mjs'
      - 'scripts/bitrix-contact-provenance.mjs'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safe Bitrix24 to PPPP contact sync
        env:
          BITRIX_HOST: b24-cl53os.bitrix24.com
          BITRIX_LOGIN: sales@prissteel.com
          BITRIX_APP_PASSWORD: ${{ secrets.BITRIX_APP_PASSWORD }}
          PPPP_SYNC_EMAIL: ${{ secrets.PPPP_SYNC_EMAIL }}
          PPPP_SYNC_PASSWORD: ${{ secrets.PPPP_SYNC_PASSWORD }}
          SYNC_MODE: ${{ github.event_name == 'schedule' && 'apply' || github.event_name == 'workflow_dispatch' && inputs.mode || 'preview' }}
        run: node scripts/bitrix-pppp-sync.mjs

      - name: Record Bitrix24 contact provenance
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')
        env:
          BITRIX_HOST: b24-cl53os.bitrix24.com
          BITRIX_LOGIN: sales@prissteel.com
          BITRIX_APP_PASSWORD: ${{ secrets.BITRIX_APP_PASSWORD }}
          PPPP_SYNC_EMAIL: ${{ secrets.PPPP_SYNC_EMAIL }}
          PPPP_SYNC_PASSWORD: ${{ secrets.PPPP_SYNC_PASSWORD }}
        run: node scripts/bitrix-contact-provenance.mjs

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitrix-pppp-sync
          path: tmp/bitrix-pppp-sync.json
          if-no-files-found: ignore
          retention-days: 3
