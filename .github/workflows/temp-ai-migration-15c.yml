name: TEMP Cleanup 15C AI migration

on:
  push:
    branches:
      - cleanup/ai-request-api-email-offer-20260814
    paths:
      - scripts/apply-ai-migration-15c.mjs
      - .github/workflows/temp-ai-migration-15c.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/ai-request-api-email-offer-20260814
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded migration
        run: node scripts/apply-ai-migration-15c.mjs

      - name: Validate generated runtime metadata
        run: |
          node scripts/bootstrap-sequence-check.mjs
          node scripts/generate-bootstrap.mjs --check
          node scripts/runtime-manifest-check.mjs

      - name: Commit generated migration to branch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pristeel-groq-rate-limit.js pristeel-email-offer-intake-v1.js runtime-bootstrap-order.json pristeel-project-emails.js runtime-manifest.json scripts/bootstrap-sequence-check.mjs
          if git diff --cached --quiet; then
            echo "No migration changes were produced." >&2
            exit 1
          fi
          git commit -m "Apply explicit AI request API migration"
          git push origin HEAD:cleanup/ai-request-api-email-offer-20260814
