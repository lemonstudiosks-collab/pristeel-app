name: PPPP runtime manifest guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify active runtime manifest
        run: node scripts/runtime-manifest-check.mjs

      - name: Verify ordered bootstrap sequence
        run: node scripts/bootstrap-sequence-check.mjs

      - name: Verify generated bootstrap artifact
        run: node scripts/generate-bootstrap.mjs --check

      - name: Verify AI provider runtime contracts
        run: node scripts/ai-provider-contract-check.mjs
