name: PPPP production Pages site build

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Re-run Pages production artifact audit
        run: node scripts/pages-artifact-audit.mjs

      - name: Build production Pages site
        run: node scripts/pages-artifact-build.mjs

      - name: Include routed TED sales assets
        run: |
          set -euo pipefail
          test -s ted-sales.html
          test -s pristeel-ui-standard-v1.css
          cp ted-sales.html _site/ted-sales.html
          cp pristeel-ui-standard-v1.css _site/pristeel-ui-standard-v1.css
          test -s _site/ted-sales.html
          test -s _site/pristeel-ui-standard-v1.css

      - name: Serve production artifact locally
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory _site >/tmp/pppp-site-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/pristeel-procurement.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/pristeel-gmail-launcher-v2.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/pristeel-document-center.css >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/gmail-addon/pristeel-addon-icon.svg >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/ted-sales.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/pristeel-ui-standard-v1.css >/dev/null
          grep -Fq 'pristeel-ui-standard-v1.css' _site/ted-sales.html

          echo "Production Pages artifact HTTP smoke OK, including TED sales route."

      - name: Confirm production deploy uses verified artifact
        run: |
          set -e
          grep -Fq "node scripts/pages-artifact-build.mjs" .github/workflows/static.yml
          grep -Fq "cp ted-sales.html _site/ted-sales.html" .github/workflows/static.yml
          grep -Fq "cp pristeel-ui-standard-v1.css _site/pristeel-ui-standard-v1.css" .github/workflows/static.yml
          grep -Fq "path: '_site'" .github/workflows/static.yml
          if grep -Fq "path: '.'" .github/workflows/static.yml; then
            echo "ERROR: whole-repository Pages upload path is still present"
            exit 1
          fi
          echo "Production Pages builds and uploads only _site, with routed TED assets included."

      - name: Upload production site check artifact
        uses: actions/upload-artifact@v4
        with:
          name: pppp-production-pages-site-check
          path: _site
          include-hidden-files: true
          retention-days: 3
