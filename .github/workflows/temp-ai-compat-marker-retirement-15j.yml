name: TEMP Cleanup 15J AI compatibility-marker retirement

on:
  push:
    branches:
      - cleanup/ai-compat-marker-retirement-20260814
    paths:
      - scripts/apply-ai-compat-marker-retirement-15j.mjs
      - .github/workflows/temp-ai-compat-marker-retirement-15j.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ai-compat-marker-retirement-20260814
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatibility-marker retirement
        run: node scripts/apply-ai-compat-marker-retirement-15j.mjs
      - name: Validate isolated marker retirement
        run: |
          node scripts/ai-compat-marker-retirement-smoke.mjs
          node scripts/project-analysis-ai-smoke.mjs
          node scripts/q-analyze-batch-ai-smoke.mjs
          node scripts/q-analyze-offer-ai-smoke.mjs
          node scripts/parse-offer-ai-smoke.mjs
          node scripts/start-parsing-ai-smoke.mjs
          node scripts/runtime-manifest-check.mjs
          node scripts/bootstrap-sequence-check.mjs
          node scripts/generate-bootstrap.mjs --check
          git diff --check
      - name: Commit runtime migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pristeel-groq-rate-limit.js pristeel-groq-gptoss-provider-v1.js runtime-manifest.json
          if git diff --cached --quiet; then
            echo "No marker-retirement runtime changes produced." >&2
            exit 1
          fi
          git commit -m "Retire AI compatibility-marker runtime semantics"
          git push origin HEAD:cleanup/ai-compat-marker-retirement-20260814
