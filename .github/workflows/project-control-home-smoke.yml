name: Project Control Home smoke

on:
  pull_request:
    paths:
      - 'pristeel-project-control-home-v1.js'
      - 'pristeel-home-operating-grid-v1.js'
      - 'pristeel-redesign-finalizer-v1.js'
      - 'pristeel-home-happy-v1.js'
      - 'pages-artifact-manifest.json'
      - 'tests/project-control-home-smoke.mjs'
      - '.github/workflows/project-control-home-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'pristeel-project-control-home-v1.js'
      - 'pristeel-home-operating-grid-v1.js'
      - 'pristeel-redesign-finalizer-v1.js'
      - 'pristeel-home-happy-v1.js'
      - 'pages-artifact-manifest.json'
      - 'tests/project-control-home-smoke.mjs'
      - '.github/workflows/project-control-home-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check pristeel-project-control-home-v1.js
          node --check pristeel-home-operating-grid-v1.js
      - name: Verify PPPP Home control-room contract
        run: node tests/project-control-home-smoke.mjs
