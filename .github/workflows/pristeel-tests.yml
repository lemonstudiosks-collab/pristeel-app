name: PRISTEEL Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full test suite
        run: npm test
      - name: Run explicit AI request API smoke
        run: node scripts/ai-request-api-smoke.mjs
      - name: Run project Drive cross-device smoke
        run: node tests/project-drive-cross-device-smoke.js
      - name: Run KEK tender collector smoke
        run: node tests/kek-tender-sync-smoke.mjs
      - name: Run KEK tender postprocess smoke
        run: node tests/kek-tender-postprocess-smoke.mjs
      - name: Run KEK tender UI smoke
        run: node tests/kek-tender-watch-smoke.js
      - name: Run original invoice document smoke
        run: node --check pristeel-invoice-original-document-v1.js && node tests/invoice-original-document-smoke.js
