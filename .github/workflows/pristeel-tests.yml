name: PRISTEEL Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run startup guard smoke
        run: node tests/startup-guard-smoke.js
      - name: Run startup visual stability smoke
        run: node tests/startup-visual-stability-smoke.js
      - name: Run roles startup stability smoke
        run: node tests/roles-startup-stability-smoke.js
      - name: Run Home stability smoke
        run: node tests/home-stability-v2-smoke.js
      - name: Run redesign finalizer smoke
        run: node tests/redesign-finalizer-smoke.js
      - name: Run full test suite
        run: npm test
      - name: Run trading project display smoke
        run: node --check pristeel-projects-modern-v1.js && node tests/project-trading-display-smoke.js
      - name: Run operational lifecycle smoke
        run: node tests/operational-lifecycle-smoke.mjs
      - name: Run project intake continuity smoke
        run: node --check pristeel-project-intake-continuity-v1.js && node tests/project-intake-continuity-smoke.js
      - name: Run Gmail project auto-link smoke
        run: node --check pristeel-gmail-project-auto-link-v1.js && node tests/gmail-project-auto-link-smoke.js
      - name: Run Gmail tracker source smoke
        run: node tests/gmail-tracker-source-smoke.mjs && node tests/gmail-attachment-metadata-smoke.mjs && node tests/gmail-body-hydration-helper-smoke.mjs && node tests/gmail-attachment-scan-state-smoke.mjs
      - name: Run project document intake smoke
        run: node tests/project-document-intelligence-helper-smoke.mjs && node tests/project-document-intake-source-smoke.mjs
      - name: Run project email body hydration smoke
        run: node --check pristeel-project-email-body-sync-v1.js && node tests/project-email-body-hydration-smoke.js
      - name: Run workspace task source shortcut smoke
        run: node --check pristeel-task-source-actions-v1.js && node tests/task-source-actions-smoke.js
      - name: Run RFQ Gmail history sync smoke
        run: node --check pristeel-rfq-gmail-history-sync-v1.js && node tests/rfq-gmail-history-sync-smoke.js
      - name: Run project summary command smoke
        run: node --check pristeel-project-summary-command-v1.js && node tests/project-summary-command-smoke.js
      - name: Run project lifecycle tracking smoke
        run: node --check pristeel-project-lifecycle-tracking-v1.js && node tests/project-lifecycle-tracking-smoke.js
      - name: Run Project Intelligence resilience smoke
        run: node --check pristeel-project-intelligence-resilience-v1.js && node tests/project-intelligence-resilience-smoke.js
      - name: Run Project Intelligence conversation smoke
        run: node --check pristeel-project-intelligence-conversation-v1.js && node tests/project-intelligence-conversation-smoke.js
      - name: Run explicit AI request API smoke
        run: node scripts/ai-request-api-smoke.mjs
      - name: Run explicit AI provider routing smoke
        run: node scripts/ai-provider-routing-smoke.mjs
      - name: Run AI fetch-wrapper removal smoke
        run: node scripts/ai-fetch-wrapper-removal-smoke.mjs
      - name: Run AI compatibility-marker retirement smoke
        run: node scripts/ai-compat-marker-retirement-smoke.mjs
      - name: Run startParsing AI migration smoke
        run: node scripts/start-parsing-ai-smoke.mjs
      - name: Run parseOffer AI migration smoke
        run: node scripts/parse-offer-ai-smoke.mjs
      - name: Run qAnalyzeOffer AI migration smoke
        run: node scripts/q-analyze-offer-ai-smoke.mjs
      - name: Run qAnalyze batch AI migration smoke
        run: node scripts/q-analyze-batch-ai-smoke.mjs
      - name: Run Project Analysis AI migration smoke
        run: node scripts/project-analysis-ai-smoke.mjs
      - name: Run AI Settings ownership smoke
        run: node scripts/ai-settings-ownership-smoke.mjs
      - name: Run project Drive cross-device smoke
        run: node tests/project-drive-cross-device-smoke.js
      - name: Run KEK tender collector smoke
        run: node tests/kek-tender-sync-smoke.mjs
      - name: Run KEK tender postprocess smoke
        run: node tests/kek-tender-postprocess-smoke.mjs
      - name: Run KEK tender UI smoke
        run: node tests/kek-tender-watch-smoke.js
      - name: Run original invoice document smoke
        run: node --check pristeel-invoice-original-document-v1.js && node tests/invoice-original-document-smoke.js
