name: GC-first future outreach + KRPP policy smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260907174500_gc_first_future_outreach_krpp_structure_v1.sql'
      - 'supabase/functions/pppp-opportunity-draft-generator/**'
      - 'tests/gc-first-future-krpp-policy-smoke.mjs'
      - '.github/workflows/gc-first-future-krpp-policy-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260907174500_gc_first_future_outreach_krpp_structure_v1.sql'
      - 'supabase/functions/pppp-opportunity-draft-generator/**'
      - 'tests/gc-first-future-krpp-policy-smoke.mjs'
      - '.github/workflows/gc-first-future-krpp-policy-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/gc-first-future-krpp-policy-smoke.mjs
