# Deploy the verified PPPP production artifact to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-v2"
  cancel-in-progress: false

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kontrollo sintaksen e skedareve .js
        run: |
          set -e
          for f in *.js; do
            echo "Kontrollo $f"
            node --check "$f"
          done
      - name: Kontrollo sintaksen e <script> inline ne pristeel-procurement.html
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys
          with open('pristeel-procurement.html', encoding='utf-8') as f:
              content = f.read()
          scripts = re.findall(r'<script>(.*?)</script>', content, re.DOTALL)
          ok = True
          for i, s in enumerate(scripts):
              path = f'/tmp/inline_{i}.js'
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(s)
              r = subprocess.run(['node', '--check', path], capture_output=True, text=True)
              if r.returncode != 0:
                  print(f'GABIM ne bllokun inline #{i}:')
                  print(r.stderr)
                  ok = False
          if not ok:
              sys.exit(1)
          print(f'Te {len(scripts)} blloqet inline OK')
          EOF
      - name: Kontrollo balancen e <div>
        run: |
          python3 - <<'EOF'
          import re, sys
          with open('pristeel-procurement.html', encoding='utf-8') as f:
              html = f.read()
          o = len(re.findall(r'<div\b', html))
          c = len(re.findall(r'</div>', html))
          print(f'div open={o} close={c}')
          if o != c:
              print('GABIM: <div> te pabalancuara!')
              sys.exit(1)
          EOF

  build-pages:
    needs: syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build verified production Pages artifact
        run: node scripts/pages-artifact-build.mjs
      - name: Include routed TED sales dashboard
        run: |
          set -euo pipefail
          test -s ted-sales.html
          test -s pristeel-ui-standard-v1.css
          cp ted-sales.html _site/ted-sales.html
          cp pristeel-ui-standard-v1.css _site/pristeel-ui-standard-v1.css
          test -s _site/ted-sales.html
          test -s _site/pristeel-ui-standard-v1.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
