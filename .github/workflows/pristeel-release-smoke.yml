name: PRISTEEL Release Smoke Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          files=(
            pristeel-project-emails.js
            pristeel-single-instance.js
            pristeel-dashboard-action-controls-v2.js
            pristeel-project-loss.js
            pristeel-document-shortcuts.js
            pristeel-invoice-copy-fix.js
            pristeel-document-center-core.js
            pristeel-document-adjustments-v3.js
            pristeel-workspace-architecture-v1.js
            pristeel-workspace-release-fix.js
            tests/workspace-smoke.js
          )
          for file in "${files[@]}"; do
            test -s "$file"
            node --check "$file"
          done

      - name: Verify bootstrap references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const loader = fs.readFileSync('pristeel-project-emails.js', 'utf8');
          const refs = [...loader.matchAll(/'([^']+\.js)(?:\?[^']*)?'/g)].map(m => m[1]);
          const missing = refs.filter(file => !fs.existsSync(file));
          if (missing.length) {
            console.error('Missing bootstrap files:', missing);
            process.exit(1);
          }
          const forbidden = ['pristeel-supabase-config.js', 'pristeel-login.js', 'pristeel-login-v2.html', 'pristeel-session-bridge.html'];
          const loadedForbidden = forbidden.filter(file => loader.includes(file));
          if (loadedForbidden.length) {
            console.error('Experimental auth files are loaded:', loadedForbidden);
            process.exit(1);
          }
          console.log(`Verified ${refs.length} JavaScript bootstrap references.`);
          NODE

      - name: Verify stable authentication remains in core
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('pristeel-procurement.html', 'utf8');
          const required = ['authGetSession', 'authSaveSession', 'authRefreshIfNeeded', 'pristeel_session'];
          const missing = required.filter(x => !html.includes(x));
          if (missing.length) {
            console.error('Core authentication markers missing:', missing);
            process.exit(1);
          }
          console.log('Stable core authentication markers are present.');
          NODE

      - name: Verify required legacy routes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('pristeel-procurement.html', 'utf8');
          const pages = ['qendra','import','bom','outreach','finance','contacts','kalkulator','settings','contracts','library'];
          const missing = pages.filter(page => !html.includes(`page-${page}`));
          if (missing.length) {
            console.error('Required legacy pages missing:', missing);
            process.exit(1);
          }
          console.log('All required legacy routes exist.');
          NODE

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock jsdom@24

      - name: Run workspace browser interaction test
        run: node tests/workspace-smoke.js
