name: KEK tender monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
  push:
    branches: [main]
    paths:
      - 'scripts/kek-tender-sync.mjs'
      - 'scripts/kek-tender-postprocess.mjs'
      - '.github/workflows/kek-tender-sync.yml'

permissions:
  contents: read

concurrency:
  group: kek-tender-monitor
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      PPPP_SYNC_EMAIL: ${{ secrets.PPPP_SYNC_EMAIL }}
      PPPP_SYNC_PASSWORD: ${{ secrets.PPPP_SYNC_PASSWORD }}
      KRPP_SEARCH_URL: ${{ vars.KRPP_SEARCH_URL }}
      KEK_TENDER_MIN_SCORE: '35'
      SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'apply' }}
      PPPP_SOURCE_ACCESS_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
      PPPP_SOURCE_ACCESS_TRIGGER: ${{ github.event_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Claim KRPP daily source access
        id: source_gate
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/external-source-daily-gate.mjs KRPP

      - name: Collect KEK steel tenders
        if: steps.source_gate.outputs.allowed == 'true'
        run: node scripts/kek-tender-sync.mjs

      - name: Keep only actionable precise opportunities
        if: steps.source_gate.outputs.allowed == 'true' && env.SYNC_MODE == 'apply'
        run: node scripts/kek-tender-postprocess.mjs

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kek-tender-monitor
          path: tmp/kek-tender-sync.json
          if-no-files-found: ignore
          retention-days: 14
