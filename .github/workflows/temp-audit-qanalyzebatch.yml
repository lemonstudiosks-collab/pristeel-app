name: TEMP qAnalyze batch audit

on:
  push:
    branches:
      - cleanup/ai-inline-qanalyzebatch-20260814
    paths:
      - scripts/temp-audit-qanalyzebatch.mjs
      - .github/workflows/temp-audit-qanalyzebatch.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ai-inline-qanalyzebatch-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print qAnalyze batch current contract
        run: node scripts/temp-audit-qanalyzebatch.mjs
