name: TEMP Cleanup 15J AI marker finalizer

on:
  push:
    branches:
      - cleanup/ai-compat-marker-retirement-20260814
    paths:
      - scripts/finalize-ai-compat-marker-retirement-15j.mjs
      - .github/workflows/temp-ai-compat-marker-finalize-15j.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ai-compat-marker-retirement-20260814
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply marker-retirement finalizer
        run: node scripts/finalize-ai-compat-marker-retirement-15j.mjs
      - name: Validate final marker-free provider contracts
        run: |
          node scripts/ai-compat-marker-retirement-smoke.mjs
          node scripts/ai-request-api-smoke.mjs
          node scripts/ai-provider-routing-smoke.mjs
          node scripts/ai-fetch-wrapper-removal-smoke.mjs
          node scripts/ai-settings-ownership-smoke.mjs
          node scripts/project-analysis-ai-smoke.mjs
          node scripts/q-analyze-batch-ai-smoke.mjs
          node scripts/q-analyze-offer-ai-smoke.mjs
          node scripts/parse-offer-ai-smoke.mjs
          node scripts/start-parsing-ai-smoke.mjs
          node scripts/ai-provider-contract-check.mjs
          node scripts/ai-runtime-callsite-inventory.mjs
          node scripts/runtime-manifest-check.mjs
          node scripts/bootstrap-sequence-check.mjs
          node scripts/generate-bootstrap.mjs --check
          git diff --check
      - name: Commit permanent finalization
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ai-runtime-callsite-inventory.mjs scripts/ai-provider-contract-check.mjs docs/AI_PROVIDER_RUNTIME.md
          if git diff --cached --quiet; then
            echo "No marker-retirement finalization produced." >&2
            exit 1
          fi
          git commit -m "Finalize AI compatibility-marker retirement guards"
          git push origin HEAD:cleanup/ai-compat-marker-retirement-20260814
