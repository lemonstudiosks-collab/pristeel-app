name: EVOSYS Live UI Probe

on:
  push:
    branches:
      - fix/evosys-manual-supplier-live-20260906
    paths:
      - 'scripts/evosys-live-candidate-acceptance.mjs'
      - 'scripts/evosys-live-post-deploy-acceptance.mjs'
      - '.github/workflows/evosys-live-ui-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify deployed main in authenticated EVOSYS live UI without injection
        env:
          PPPP_LIVE_URL: https://lemonstudiosks-collab.github.io/pristeel-app/
          SUPABASE_URL: https://isymxqfqzkchbsrbhucf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_PRODUCTION_SHA: 5cacbd7a5f95b90fc40bec3c9e1677643119e655
          PROBE_OUT: tmp/evosys-live-post-deploy-acceptance
        run: node scripts/evosys-live-post-deploy-acceptance.mjs

      - name: Upload live UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evosys-live-post-deploy-acceptance-${{ github.run_number }}
          path: tmp/evosys-live-post-deploy-acceptance
          if-no-files-found: warn
          retention-days: 3
