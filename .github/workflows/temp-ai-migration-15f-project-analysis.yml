name: TEMP Cleanup 15F Project Analysis migration

on:
  push:
    branches:
      - cleanup/ai-project-analysis-20260814
    paths:
      - scripts/apply-ai-migration-15f-project-analysis.mjs
      - .github/workflows/temp-ai-migration-15f-project-analysis.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ai-project-analysis-20260814
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Project Analysis migration
        run: node scripts/apply-ai-migration-15f-project-analysis.mjs
      - name: Validate isolated migration
        run: |
          node scripts/project-analysis-ai-smoke.mjs
          node scripts/q-analyze-batch-ai-smoke.mjs
          node scripts/q-analyze-offer-ai-smoke.mjs
          node scripts/parse-offer-ai-smoke.mjs
          node scripts/start-parsing-ai-smoke.mjs
          node scripts/runtime-manifest-check.mjs
          node scripts/bootstrap-sequence-check.mjs
          node scripts/generate-bootstrap.mjs --check
          git diff --check
      - name: Commit runtime migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pristeel-project-analysis.js runtime-manifest.json
          if git diff --cached --quiet; then
            echo "No runtime migration produced." >&2
            exit 1
          fi
          git commit -m "Migrate Project Analysis to explicit AI request API"
          git push origin HEAD:cleanup/ai-project-analysis-20260814
