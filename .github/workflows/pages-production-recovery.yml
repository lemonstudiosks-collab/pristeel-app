# Isolated PPPP production Pages recovery deploy.
# Recovery stays available for main commits that do not emit the primary Pages workflow.
# Pull requests must never deploy their unmerged artifact to production.
name: PPPP production recovery deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-production-recovery"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build verified production Pages artifact
        run: node scripts/pages-artifact-build.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
