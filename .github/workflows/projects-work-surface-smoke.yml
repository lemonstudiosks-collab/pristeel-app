name: Projects work surface smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  projects-work-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check pristeel-project-classification-v1.js
      - run: node tests/projects-work-surface-smoke.js
