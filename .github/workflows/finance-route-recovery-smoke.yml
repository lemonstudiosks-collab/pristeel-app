name: Finance route recovery smoke

on:
  pull_request:
    paths:
      - 'pristeel-finance-stability-v2.js'
      - 'tests/finance-route-recovery-smoke.js'
      - '.github/workflows/finance-route-recovery-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check pristeel-finance-stability-v2.js
      - run: node tests/finance-route-recovery-smoke.js
